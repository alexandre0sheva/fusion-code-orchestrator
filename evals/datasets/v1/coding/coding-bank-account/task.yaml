id: coding-bank-account
difficulty: medium
split: dev
tags:
- python
- design
- money
solution_summary: Keep balances as Decimal, validate amounts, and make transfer check
  the withdrawal before touching either account
flaws:
- summary: Keep balances as floats, so repeated cents drift and exact comparisons
    fail
- summary: Credit the destination before debiting the source, so a failed transfer
    leaves the money in both accounts
