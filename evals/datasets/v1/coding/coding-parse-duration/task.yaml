- tests.test_hidden.ParseDurationTests.test_compound
- tests.test_hidden.ParseDurationTests.test_days_and_zero
- tests.test_hidden.ParseDurationTests.test_empty_is_an_error
- tests.test_hidden.ParseDurationTests.test_non_integer_and_negative_are_errors
- tests.test_hidden.ParseDurationTests.test_repeated_unit_is_an_error
- tests.test_hidden.ParseDurationTests.test_stray_text_is_an_error
- tests.test_hidden.ParseDurationTests.test_unknown_unit_is_an_error
