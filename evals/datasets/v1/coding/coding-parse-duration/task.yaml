id: coding-parse-duration
difficulty: easy
split: test
tags:
- python
solution_summary: Match each number-and-unit part in turn, rejecting unknown or repeated
  units and stray text, and add up the seconds
flaws:
- summary: Sum every number-and-unit pair found by findall, silently skipping stray
    text and repeated or unknown units
- summary: Parse strictly but only accept lower-case units and never a bare integer
