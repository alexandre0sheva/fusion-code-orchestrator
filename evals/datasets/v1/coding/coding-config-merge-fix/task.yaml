- tests.test_hidden.MergeTests.test_lists_are_replaced_not_merged
- tests.test_hidden.MergeTests.test_nested_merge_keeps_siblings
- tests.test_hidden.MergeTests.test_none_for_a_missing_key_adds_nothing
