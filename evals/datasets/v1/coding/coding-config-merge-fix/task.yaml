id: coding-config-merge-fix
difficulty: medium
split: test
tags:
- python
- bug-fix
- multi-file
solution_summary: Deep-merge into a fresh structure with recursion, copy everything
  taken from either side, and let None in the override delete a key
flaws:
- summary: Recurse into nested dicts but start from a shallow copy of base, so lists
    and untouched sections are still shared
- summary: Deep-copy and merge recursively but store None instead of removing the
    key
