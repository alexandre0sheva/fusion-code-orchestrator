id: coding-toposort
difficulty: medium
split: test
tags:
- python
- algorithms
solution_summary: Kahn's algorithm with a heap so ties go to the alphabetically smallest
  ready node, and a cycle when nodes are left over
flaws:
- summary: Depth-first search in dictionary order, so ties are broken by insertion
    order instead of by name
- summary: Kahn's algorithm that silently returns the nodes it could order when there
    is a cycle
expected_pass:
