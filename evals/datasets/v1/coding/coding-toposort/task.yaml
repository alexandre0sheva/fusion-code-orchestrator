- tests.test_hidden.ToposortTests.test_diamond
- tests.test_hidden.ToposortTests.test_duplicate_dependencies_and_no_mutation
- tests.test_hidden.ToposortTests.test_empty_graph
- tests.test_hidden.ToposortTests.test_nodes_that_only_appear_as_dependencies_are_included
- tests.test_hidden.ToposortTests.test_self_dependency_is_a_cycle
