solution_summary: Split into paragraphs on blank lines, fill words greedily up to
  the width, and break words longer than the width into width-sized chunks
flaws:
- summary: Fill words greedily but leave a word longer than the width whole on its
    own line
- summary: Wrap the whole text as one paragraph, so blank lines vanish
