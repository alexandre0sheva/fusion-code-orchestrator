id: coding-ring-buffer-fix
difficulty: medium
split: test
tags:
- python
- bug-fix
- data-structures
solution_summary: Overwrite the oldest item when full, advance the start index modulo
  the capacity on pop, and keep the size in step
flaws:
- summary: Overwrite the oldest slot when full but forget to move the start index,
    so the newest item becomes the oldest
- summary: Fix pop's size and wrap-around but silently drop new items when the buffer
    is full
expected_pass:
