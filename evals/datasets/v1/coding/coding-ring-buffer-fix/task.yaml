- tests.test_hidden.RingBufferTests.test_empty_buffer
- tests.test_hidden.RingBufferTests.test_matches_a_deque_under_mixed_operations
- tests.test_hidden.RingBufferTests.test_overwrites_the_oldest_when_full
- tests.test_hidden.RingBufferTests.test_peek_does_not_remove
- tests.test_hidden.RingBufferTests.test_pop_returns_oldest_first_and_shrinks
- tests.test_hidden.RingBufferTests.test_wraps_around_after_pops
