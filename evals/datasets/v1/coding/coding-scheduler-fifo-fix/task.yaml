id: coding-scheduler-fifo-fix
difficulty: medium
split: test
tags:
- python
- bug-fix
- data-structures
solution_summary: Add a running sequence number as the tiebreaker so equal priorities
  are FIFO and tasks are never compared, and cancel a single task with lazy deletion
flaws:
- summary: Add a sequence number so ties are FIFO and nothing is compared, but remove
    still deletes every equal task from the list
- summary: Remove only the first matching entry but leave the heap un-reordered, and
    break ties by task value
