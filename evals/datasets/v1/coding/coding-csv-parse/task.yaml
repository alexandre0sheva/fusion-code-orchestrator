id: coding-csv-parse
difficulty: hard
split: dev
tags:
- python
- parsing
solution_summary: A character state machine with an in-quotes state, doubled-quote
  escapes, and record breaks only outside quotes
flaws:
- summary: Split the text on newlines and commas, ignoring quoting entirely
- summary: Handle quoted fields but treat a doubled quote as the end of the field
    and never raise on bad quoting
