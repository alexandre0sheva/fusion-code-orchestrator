id: coding-token-bucket
difficulty: medium
split: test
tags:
- python
- concurrency
solution_summary: Refill by elapsed time times rate, capped at capacity, on every
  call, remembering the time of the last refill
flaws:
- summary: Refill from the time of construction on every call without moving the last-refill
    time, so tokens are counted twice
- summary: Refill correctly but never cap the bucket at its capacity
