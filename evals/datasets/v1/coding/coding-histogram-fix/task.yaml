id: coding-histogram-fix
difficulty: easy
split: dev
tags:
- python
- bug-fix
- math
solution_summary: Put the maximum in the last bin instead of one past it, return zeros
  for no values, and send values equal to a degenerate range to the first bin
flaws:
- summary: Clamp the bin index so the maximum fits but still crash on equal values
    and count out-of-range values
- summary: Ignore out-of-range values and handle empty and degenerate input but let
    the maximum fall outside the last bin
