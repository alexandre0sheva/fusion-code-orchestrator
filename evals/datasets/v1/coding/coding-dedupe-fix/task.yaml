id: coding-dedupe-fix
difficulty: easy
split: dev
tags:
- python
- bug-fix
solution_summary: Keep the first occurrence in order, compare by key when one is given,
  and fall back to equality for unhashable values
flaws:
- summary: Preserve order with dict.fromkeys, which fails on unhashable items and
    ignores the key function
- summary: Handle unhashable items by comparing with equality but ignore the key function
