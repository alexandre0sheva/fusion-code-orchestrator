id: coding-retry-backoff-fix
difficulty: medium
split: dev
tags:
- python
- bug-fix
- concurrency
solution_summary: Wait only between attempts (not after the last failure), keep the
  wrapped function's metadata with functools.wraps, and validate attempts
flaws:
- summary: Keep the function's metadata with functools.wraps but still sleep after
    the final failure
- summary: Skip the sleep after the last attempt but call it with the unchanged delay
    every time and drop the metadata
expected_pass:
- tests.test_hidden.RetryTests.test_arguments_are_passed_through
- tests.test_hidden.RetryTests.test_attempts_must_be_positive
- tests.test_hidden.RetryTests.test_metadata_is_kept
- tests.test_hidden.RetryTests.test_other_exceptions_propagate_at_once
- tests.test_hidden.RetryTests.test_single_attempt_never_sleeps
- tests.test_hidden.RetryTests.test_success_on_second_attempt
- tests.test_hidden.RetryTests.test_the_last_exception_is_raised
- tests.test_hidden.RetryTests.test_waits_grow_and_none_after_the_last_attempt
