- tests.test_hidden.MergeIntervalsTests.test_result_holds_tuples
- tests.test_hidden.MergeIntervalsTests.test_separate_intervals_stay_separate
- tests.test_hidden.MergeIntervalsTests.test_single_and_empty
- tests.test_hidden.MergeIntervalsTests.test_touching_intervals_merge
- tests.test_hidden.MergeIntervalsTests.test_unsorted_input
