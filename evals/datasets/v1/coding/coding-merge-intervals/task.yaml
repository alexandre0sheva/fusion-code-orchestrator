id: coding-merge-intervals
difficulty: easy
split: dev
tags:
- python
solution_summary: Sort by start, then extend the last merged interval to the larger
  end whenever the next start is not past it
flaws:
- summary: Merge only strictly overlapping intervals, so intervals that touch stay
    separate
- summary: Take the later interval's end when merging, so a nested interval shrinks
    the result
expected_pass:
