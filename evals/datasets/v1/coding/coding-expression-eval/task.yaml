solution_summary: 'A recursive-descent parser: expression over terms over unary over
  power over atoms, with ** right-associative and binding tighter than a unary minus
  on its left'
flaws:
- summary: Make ** left-associative and let a unary minus bind tighter than **, so
    2 ** 3 ** 2 is 64 and -2 ** 2 is 4
- summary: Evaluate with a loop over tokens that stops at the first thing it does
    not understand, so trailing text and a second operand are ignored
