id: coding-json-pointer
difficulty: medium
split: dev
tags:
- python
- parsing
solution_summary: Split on slashes, unescape each token with ~1 before ~0, and walk
  dicts and lists, treating digit-only tokens without leading zeros as list indexes
  and - as append
flaws:
- summary: Unescape ~0 before ~1, so ~01 decodes to / instead of ~1
- summary: Accept any integer token as a list index, including leading zeros and negatives,
    and never append
