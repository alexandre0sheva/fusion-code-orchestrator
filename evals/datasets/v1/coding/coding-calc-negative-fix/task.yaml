id: coding-calc-negative-fix
difficulty: hard
split: test
tags:
- python
- bug-fix
- parsing
- multi-file
solution_summary: Tokenize numbers without a sign and let the parser handle unary
  plus and minus, and build left-associative chains for + - and * / with loops instead
  of right recursion
flaws:
- summary: Fix the tokenizer so numbers carry no sign and add unary operators, but
    keep the right-recursive chains so 10 - 4 - 3 is still 9
- summary: Make the chains left-associative with loops but leave the tokenizer gluing
    a minus sign onto the number after it
