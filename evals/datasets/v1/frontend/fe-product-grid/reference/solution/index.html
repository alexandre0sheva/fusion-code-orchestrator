<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearth & Home shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Hearth &amp; Home</h1>
    <ul class="products">
      <li class="product">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="160" height="160" alt="Blue ceramic mug">
        <h2>Blue ceramic mug</h2>
        <p class="price">$14</p>
        <button class="btn" type="button" aria-label="Add Blue ceramic mug to cart">Add to cart</button>
      </li>
      <li class="product">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="160" height="160" alt="Linen tea towel">
        <h2>Linen tea towel</h2>
        <p class="price">$9</p>
        <button class="btn" type="button" aria-label="Add Linen tea towel to cart">Add to cart</button>
      </li>
      <li class="product">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="160" height="160" alt="Oak serving board">
        <h2>Oak serving board</h2>
        <p class="price">$32</p>
        <button class="btn" type="button" aria-label="Add Oak serving board to cart">Add to cart</button>
      </li>
      <li class="product">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="160" height="160" alt="Brass candle holder">
        <h2>Brass candle holder</h2>
        <p class="price">$21</p>
        <button class="btn" type="button" aria-label="Add Brass candle holder to cart">Add to cart</button>
      </li>
      <li class="product">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="160" height="160" alt="Wool throw blanket">
        <h2>Wool throw blanket</h2>
        <p class="price">$68</p>
        <button class="btn" type="button" aria-label="Add Wool throw blanket to cart">Add to cart</button>
      </li>
      <li class="product">
        <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="160" height="160" alt="Glass storage jar">
        <h2>Glass storage jar</h2>
        <p class="price">$12</p>
        <button class="btn" type="button" aria-label="Add Glass storage jar to cart">Add to cart</button>
      </li>
    </ul>
  </main>
</body>
</html>
