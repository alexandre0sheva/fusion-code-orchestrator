<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revenue widget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Sales overview</h1>
    <section class="widget" aria-labelledby="rev-title">
      <header class="widget-head">
        <h2 id="rev-title">Revenue</h2>
        <p class="range">
          <label for="range">Range</label>
          <select tabindex="4" id="range" name="range">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </p>
      </header>
      <dl class="kpis">
        <div class="kpi"><dt>Total revenue</dt><dd>$48,210</dd></div>
        <div class="kpi"><dt>Orders</dt><dd>1,284</dd></div>
        <div class="kpi"><dt>Average order</dt><dd>$37.55</dd></div>
        <div class="kpi"><dt>Refund rate</dt><dd>1.8%</dd></div>
      </dl>
      <svg class="spark" viewBox="0 0 120 32" role="img" aria-label="Daily revenue over the last 30 days, rising">
        <title>Daily revenue over the last 30 days</title>
        <polyline points="0,26 15,22 30,24 45,16 60,18 75,10 90,12 105,6 120,4" fill="none" stroke="#0b5fff" stroke-width="2"/>
      </svg>
    </section>
  </main>
</body>
</html>
