id: perf-word-frequency
category: performance
difficulty: easy
split: test
tags:
- python
- performance
- counting
expected_pass:
- tests.test_hidden.HiddenTests.test_ties_are_alphabetical
- tests.test_hidden.HiddenTests.test_k_larger_than_distinct_words
- tests.test_hidden.HiddenTests.test_k_zero
- tests.test_hidden.HiddenTests.test_apostrophes_stay_in_words
- tests.test_hidden.HiddenTests.test_empty_text
- tests.test_hidden.HiddenTests.test_punctuation_and_digits_separate_words
solution_summary: Count the words in one pass with a Counter instead of counting each
  distinct word separately
flaws:
- summary: Count each word with a generator expression over every word
- summary: Use Counter.most_common, whose ties follow first appearance instead of
    alphabetical order
perf:
  sizes:
  - 2000
  - 4000
  - 8000
  samples: 5
  warmup: 1
  max_ratio: 3.0
  timeout_s: 60
hard_gates:
- id: tests-pass
  evidence: tests
  description: the hidden tests pass
- id: fast-enough
  evidence: perf
  description: close to the reference, same scaling
soft_criteria:
- id: correctness
  weight: 3
  source: tests
- id: performance
  weight: 3
  source: perf
- id: code_quality
  weight: 1
  source: static
