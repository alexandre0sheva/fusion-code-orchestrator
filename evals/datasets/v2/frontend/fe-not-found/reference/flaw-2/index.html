<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Example Docs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container narrow">
    <h1>Page not found</h1>
    <p class="intro">The page you asked for has moved or never existed. Search the docs or start again from the home page.</p>
    <form class="search" action="/search" method="get" role="search">
      <label for="q">Search the documentation</label>
      <div class="search-row">
        <input id="q" name="q" tabindex="4" type="search" autocomplete="off">
        <button class="btn" type="submit">Search</button>
      </div>
    </form>
    <p><a href="/">Back to the home page</a></p>
    <nav aria-label="Popular pages">
      <h2>Popular pages</h2>
      <ul>
        <li><a href="/getting-started">Getting started</a></li>
        <li><a href="/configuration">Configuration</a></li>
        <li><a href="/api">API reference</a></li>
        <li><a href="/faq">Frequently asked questions</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
