- id: dbg-py-08
  category: debugging
  language: python
  difficulty: hard
  split: dev
  symptom: |
    The long-running worker's memory grows by about 40 MB per hour until the container is
    OOM-killed, even though it processes jobs one at a time and keeps no list of past jobs.
    A heap snapshot shows thousands of `Thumbnailer` objects still alive.
  files:
    - path: worker/thumbnails.py
      content: |
        import functools
        from pathlib import Path

        from PIL import Image


        class Thumbnailer:
            def __init__(self, size: tuple[int, int], cache_dir: Path) -> None:
                self.size = size
                self.cache_dir = cache_dir
                self._font = None

            @functools.lru_cache(maxsize=None)
            def target_path(self, source: str) -> Path:
                name = Path(source).stem
                return self.cache_dir / f"{name}_{self.size[0]}x{self.size[1]}.jpg"

            def render(self, source: str) -> Path:
                target = self.target_path(source)
                if not target.exists():
                    with Image.open(source) as img:
                        img.thumbnail(self.size)
                        img.convert("RGB").save(target, "JPEG", quality=85)
                return target
    - path: worker/jobs.py
      content: |
        from pathlib import Path

        from worker.thumbnails import Thumbnailer


        def handle_job(job: dict) -> str:
            thumbnailer = Thumbnailer(tuple(job["size"]), Path(job["cache_dir"]))
            return str(thumbnailer.render(job["source"]))
  trace: |
    # tracemalloc top 3 after 6 hours (2,100 jobs)
    1. functools.py:  cache_wrapper   212.4 MiB  (the cache dict and its keys)
    2. worker/thumbnails.py:20  Thumbnailer.render   31.8 MiB
    3. PIL/Image.py:3245 open   18.2 MiB
    # gc.get_objects(): 2,100 live Thumbnailer instances
  logs: |
    2026-03-07 03:00:00 INFO worker rss=310MB jobs=0
    2026-03-07 05:00:00 INFO worker rss=1.1GB jobs=700
    2026-03-07 08:59:58 INFO worker rss=2.4GB jobs=2100
    2026-03-07 09:00:41 ERROR container killed: OOMKilled
  root_cause_tags: [lru-cache-on-method, cache-holds-self-reference]
  root_cause_aliases:
    lru-cache-on-method: [functools.lru_cache on a method, lru_cache decorating an instance method, cache decorator on method, unbounded lru_cache]
    cache-holds-self-reference: [self is part of the cache key, the cache keeps instances alive, strong reference to self, instances are never freed]
  root_cause: "`lru_cache` on an instance method keys the cache on `self`, so the unbounded module-level cache holds a strong reference to every `Thumbnailer` ever created, and with it its entries."
  fix_keywords: ["remove|drop|do not use lru_cache|staticmethod|module-level function", "maxsize|per-instance|cached_property|weakref"]

- id: dbg-py-09
  category: debugging
  language: python
  difficulty: hard
  split: test
  symptom: |
    The report exporter hangs forever on large exports. Small exports are fine. When it hangs,
    the child process is still running, and `py-spy dump` shows the parent waiting.
  files:
    - path: export/runner.py
      content: |
        import subprocess
        import sys


        def run_export(dataset: str, out_path: str) -> str:
            """Run the exporter CLI and return what it printed."""
            proc = subprocess.Popen(
                [sys.executable, "-m", "exporter", "--dataset", dataset, "--out", out_path],
                stdout=subprocess.PIPE,
                stderr=subprocess.STDOUT,
                text=True,
            )
            code = proc.wait()
            output = proc.stdout.read()
            if code != 0:
                raise RuntimeError(f"export failed ({code}):\n{output[-2000:]}")
            return output
    - path: exporter/__main__.py
      content: |
        import argparse
        import sys

        from exporter.core import rows_for


        def main() -> None:
            parser = argparse.ArgumentParser()
            parser.add_argument("--dataset", required=True)
            parser.add_argument("--out", required=True)
            args = parser.parse_args()
            with open(args.out, "w", encoding="utf-8") as out:
                for i, row in enumerate(rows_for(args.dataset)):
                    out.write(",".join(map(str, row)) + "\n")
                    print(f"exported row {i}: {row[0]}", file=sys.stdout, flush=True)


        main()
  trace: |
    # py-spy dump --pid 4417 (parent)
    Thread 4417 (idle): "MainThread"
        wait (subprocess.py:1957)
        run_export (export/runner.py:13)
        main (jobs/nightly.py:31)
    # ps for the child (pid 4420): state S (sleeping), blocked in write(1, ...)
    # exports under ~1,000 rows finish; exports over ~3,000 rows never do
  logs: |
    2026-03-08 01:00:00 INFO nightly export dataset=small rows=420 done in 0.9s
    2026-03-08 01:00:02 INFO nightly export dataset=customers rows=51200 started
    2026-03-08 04:00:02 WARN nightly export dataset=customers still running after 3h
  root_cause_tags: [pipe-buffer-deadlock, wait-before-reading-pipe]
  root_cause_aliases:
    pipe-buffer-deadlock: [pipe buffer is full, deadlock on pipe, child blocks writing to stdout, OS pipe buffer, 64 KB]
    wait-before-reading-pipe: [wait() before reading stdout, proc.wait deadlock, parent waits while child waits for the parent to read]
  root_cause: "The parent calls `proc.wait()` before reading the child's stdout pipe; once the child has written more than the OS pipe buffer it blocks on write while the parent waits for it to exit."
  fix_keywords: ["communicate", "subprocess.run|capture_output|read before wait|drain|redirect to a file"]
