- id: cr-py-04
  category: code_review
  language: python
  difficulty: medium
  split: dev
  tags: [correctness, api]
  title: Generic pagination helper
  description: |
    Adds `paginate` and `iter_pages` so list endpoints stop hand-rolling slicing. Pages are
    numbered from 1, as in the public API.
  files:
    - path: common/pagination.py
      diff: |
        +from dataclasses import dataclass
        +from typing import Generic, Sequence, TypeVar
        +
        +T = TypeVar("T")
        +
        +DEFAULT_PAGE_SIZE = 25
        +MAX_PAGE_SIZE = 100
        +
        +
        +@dataclass
        +class Page(Generic[T]):
        +    items: list[T]
        +    page: int
        +    page_size: int
        +    total: int
        +
        +    @property
        +    def pages(self) -> int:
        +        return (self.total + self.page_size - 1) // self.page_size
        +
        +    @property
        +    def has_next(self) -> bool:
        +        return self.page < self.pages
        +
        +
        +def paginate(rows: Sequence[T], page: int = 1, page_size: int = DEFAULT_PAGE_SIZE) -> Page[T]:
        +    """Return one page of rows. Pages are numbered from 1."""
        +    if page < 1:
        +        raise ValueError("page must be >= 1")
        +    page_size = max(1, min(page_size, MAX_PAGE_SIZE))
        +    start = page * page_size«b1»
        +    end = start + page_size
        +    return Page(items=list(rows[start:end]), page=page, page_size=page_size, total=len(rows))
        +
        +
        +def iter_pages(rows: Sequence[T], page_size: int = DEFAULT_PAGE_SIZE):
        +    page = 1
        +    while True:
        +        current = paginate(rows, page, page_size)
        +        yield current
        +        if not current.has_next:
        +            return
        +        page += 1
  bugs:
    - id: b1
      category: off-by-one
      severity: high
      description: Pages are numbered from 1 but the start offset is `page * page_size`, so the first page is skipped and the last page is empty.
      aliases: [off by one, wrong offset, (page - 1), skips the first page, one-based]

