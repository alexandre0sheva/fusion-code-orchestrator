- id: cr-py-06
  category: code_review
  language: python
  difficulty: hard
  split: test
  tags: [concurrency, security]
  title: Per-tenant API token cache
  description: |
    Adds `TokenCache`, which caches the API token for each tenant and refreshes it 30 seconds
    before it expires. `invalidate` is called when a tenant's credentials are rotated, and must
    guarantee that no token fetched with the old credentials is served afterwards. Many request
    threads share one cache.
  files:
    - path: gateway/token_cache.py
      diff: |
        +import threading
        +import time
        +from typing import Callable
        +
        +
        +class TokenCache:
        +    """Caches API tokens per tenant and refreshes them shortly before they expire."""
        +
        +    def __init__(self, fetch: Callable[[str], tuple[str, float]], skew: float = 30.0):
        +        self._fetch = fetch
        +        self._skew = skew
        +        self._tokens: dict[str, tuple[str, float]] = {}
        +        self._lock = threading.Lock()
        +
        +    def _fresh(self, entry: tuple[str, float] | None) -> bool:
        +        return entry is not None and entry[1] - self._skew > time.time()
        +
        +    def get(self, tenant: str) -> str:
        +        with self._lock:
        +            entry = self._tokens.get(tenant)
        +        if entry is not None and self._fresh(entry):
        +            return entry[0]
        +        token, expires_at = self._fetch(tenant)«b1»
        +        with self._lock:
        +            self._tokens[tenant] = (token, expires_at)
        +        return token
        +
        +    def invalidate(self, tenant: str) -> None:
        +        with self._lock:
        +            self._tokens.pop(tenant, None)
        +
        +    def size(self) -> int:
        +        with self._lock:
        +            return len(self._tokens)
  bugs:
    - id: b1
      category: race-condition
      severity: high
      description: The token is fetched outside the lock and stored afterwards, so a fetch that started before `invalidate` writes its stale token back after the invalidation, and concurrent misses each fetch a token.
      aliases: [race, check-then-act, stale token, thundering herd, lost invalidation, not atomic]

- id: cr-py-07
  category: code_review
  language: python
  difficulty: hard
  split: dev
  tags: [concurrency]
  title: Thread-safe LRU cache
  description: |
    Adds a small least-recently-used cache shared by the worker threads of the thumbnailing
    service, replacing an unbounded dict. `get_or_set` must call the factory at most once per
    missing key.
  files:
    - path: common/lru.py
      diff: |
        +import threading
        +from collections import OrderedDict
        +from typing import Generic, Hashable, TypeVar
        +
        +K = TypeVar("K", bound=Hashable)
        +V = TypeVar("V")
        +_MISSING = object()
        +
        +
        +class LRUCache(Generic[K, V]):
        +    """A fixed-size least-recently-used cache that is safe to share between threads."""
        +
        +    def __init__(self, capacity: int):
        +        if capacity < 1:
        +            raise ValueError("capacity must be positive")
        +        self._capacity = capacity
        +        self._data: OrderedDict[K, V] = OrderedDict()
        +        self._lock = threading.RLock()
        +        self.hits = 0
        +        self.misses = 0
        +
        +    def get(self, key: K, default=None):
        +        with self._lock:
        +            value = self._data.get(key, _MISSING)
        +            if value is _MISSING:
        +                self.misses += 1
        +                return default
        +            self._data.move_to_end(key)
        +            self.hits += 1
        +            return value
        +
        +    def put(self, key: K, value: V) -> None:
        +        with self._lock:
        +            if key in self._data:
        +                self._data.move_to_end(key)
        +            self._data[key] = value
        +            while len(self._data) > self._capacity:
        +                self._data.popitem(last=False)
        +
        +    def get_or_set(self, key: K, factory) -> V:
        +        with self._lock:
        +            value = self.get(key, _MISSING)
        +            if value is _MISSING:
        +                value = factory()
        +                self.put(key, value)
        +            return value
        +
        +    def __len__(self) -> int:
        +        with self._lock:
        +            return len(self._data)
  bugs: []

- id: cr-py-08
  category: code_review
  language: python
  difficulty: hard
  split: dev
  tags: [security, web]
  title: Authenticated file download and delete endpoints
  description: |
    Adds endpoints to download and delete uploaded files under `/srv/app/uploads`. Both require
    the service API token. The token check is moved out of the decorator into a helper.
  files:
    - path: api/files.py
      diff: |
        =import hmac
        =import os
        =
        =from flask import Flask, abort, request, send_file
        =
        =app = Flask(__name__)
        =UPLOAD_DIR = "/srv/app/uploads"
        =API_TOKEN = os.environ["API_TOKEN"]
        =
        =
        =def authorised() -> bool:
        =    supplied = request.headers.get("Authorization", "").removeprefix("Bearer ")
        -    return hmac.compare_digest(supplied, API_TOKEN)
        +    return supplied == API_TOKEN«b2»
        =
        =
        +@app.get("/files/<path:name>")
        +def download(name: str):
        +    if not authorised():
        +        abort(401)
        +    target = os.path.join(UPLOAD_DIR, name)«b1»
        +    if not os.path.isfile(target):
        +        abort(404)
        +    return send_file(target)
        +
        +
        +@app.delete("/files/<path:name>")
        +def remove(name: str):
        +    if not authorised():
        +        abort(401)
        +    target = os.path.realpath(os.path.join(UPLOAD_DIR, name))
        +    if not target.startswith(os.path.realpath(UPLOAD_DIR) + os.sep):
        +        abort(400)
        +    if os.path.isfile(target):
        +        os.remove(target)
        +    return "", 204
  bugs:
    - id: b1
      category: path-traversal
      severity: critical
      description: "`name` is joined to the upload directory without normalising it, so `../../etc/passwd` escapes it; the delete endpoint resolves and checks the path, the download endpoint does not."
      aliases: [directory traversal, path traversal, "../", realpath, escapes the upload directory]
    - id: b2
      category: timing-attack
      severity: medium
      description: The token is compared with `==`, which leaks timing information; the previous code used `hmac.compare_digest`.
      aliases: [timing attack, constant-time, compare_digest, non-constant-time comparison, timing side channel]

- id: cr-py-09
  category: code_review
  language: python
  difficulty: medium
  split: test
  tags: [correctness, time]
  title: Daily and hourly event buckets for the usage report
  description: |
    Adds helpers that group events by calendar day and hour for the usage report. The report is
    defined in UTC; the servers run in `America/New_York`.
  files:
    - path: reports/buckets.py
      diff: |
        =from collections import defaultdict
        =from datetime import datetime, timezone
        =
        =
        +def day_bucket(ts: float) -> str:
        +    """The UTC calendar day (YYYY-MM-DD) an event at Unix time ``ts`` belongs to."""
        +    return datetime.fromtimestamp(ts).strftime("%Y-%m-%d")«b1»
        +
        +
        +def hour_bucket(ts: float) -> str:
        +    """The UTC hour (YYYY-MM-DD HH:00) an event at Unix time ``ts`` belongs to."""
        +    return datetime.fromtimestamp(ts, tz=timezone.utc).strftime("%Y-%m-%d %H:00")
        +
        +
        +def count_by_day(timestamps: list[float]) -> dict[str, int]:
        +    counts: dict[str, int] = defaultdict(int)
        +    for ts in timestamps:
        +        counts[day_bucket(ts)] += 1
        +    return dict(counts)
        +
        +
        +def count_by_hour(timestamps: list[float]) -> dict[str, int]:
        +    counts: dict[str, int] = defaultdict(int)
        +    for ts in timestamps:
        +        counts[hour_bucket(ts)] += 1
        +    return dict(counts)
        +
        +
        +def busiest(counts: dict[str, int]) -> tuple[str, int] | None:
        +    if not counts:
        +        return None
        +    key = max(counts, key=counts.__getitem__)
        +    return key, counts[key]
  bugs:
    - id: b1
      category: timezone-bug
      severity: medium
      description: "`datetime.fromtimestamp(ts)` uses the server's local time (America/New_York), not UTC, so events near midnight land in the wrong day; `hour_bucket` passes `tz=timezone.utc` correctly."
      aliases: [timezone, local time, utc, naive datetime, tz=timezone.utc, utcfromtimestamp]
