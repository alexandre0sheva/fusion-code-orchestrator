# Code-review tasks, Python. Format: see src/fusion/bench/datasets/build.py and evals/datasets/README.md.
# Diff lines start with = (unchanged), + (added) or - (removed); «id» marks the line a bug is on.

- id: cr-py-01
  category: code_review
  language: python
  difficulty: easy
  split: dev
  tags: [security, web]
  title: Add user search endpoint
  description: |
    Adds `GET /users/search?q=...` to the admin API so support staff can find a user by part of
    their name. Results are capped at 100 rows.
  files:
    - path: api/users.py
      diff: |
        =import sqlite3
        =from flask import Flask, jsonify, request
        =
        =app = Flask(__name__)
        =DB_PATH = "app.db"
        =
        =
        =def get_db():
        =    conn = sqlite3.connect(DB_PATH)
        =    conn.row_factory = sqlite3.Row
        =    return conn
        =
        =
        =@app.get("/users/<int:user_id>")
        =def get_user(user_id):
        =    db = get_db()
        =    row = db.execute("SELECT id, name, email FROM users WHERE id = ?", (user_id,)).fetchone()
        =    db.close()
        =    if row is None:
        =        return jsonify({"error": "not found"}), 404
        =    return jsonify(dict(row))
        =
        +@app.get("/users/search")
        +def search_users():
        +    term = request.args.get("q", "").strip()
        +    if not term:
        +        return jsonify({"error": "missing query"}), 400
        +    limit = min(request.args.get("limit", 20, type=int), 100)
        +    db = get_db()
        +    sql = f"SELECT id, name, email FROM users WHERE name LIKE '%{term}%' LIMIT ?"«b1»
        +    rows = db.execute(sql, (limit,)).fetchall()
        +    db.close()
        +    return jsonify([dict(r) for r in rows])
  bugs:
    - id: b1
      category: sql-injection
      severity: critical
      description: The search term is interpolated into the SQL text with an f-string instead of being passed as a bound parameter.
      aliases: [sql injection, string-formatted query, unparameterized query, f-string query]

- id: cr-py-02
  category: code_review
  language: python
  difficulty: medium
  split: dev
  tags: [reliability]
  title: Add a retry decorator for flaky network calls
  description: |
    Adds `retry`, a decorator that retries a function on connection errors with exponential
    backoff and full jitter. Used by the payment gateway client in a follow-up PR.
  files:
    - path: common/retry.py
      diff: |
        +import functools
        +import logging
        +import random
        +import time
        +from collections.abc import Callable
        +from typing import TypeVar
        +
        +T = TypeVar("T")
        +log = logging.getLogger(__name__)
        +
        +
        +def retry(
        +    attempts: int = 3,
        +    base_delay: float = 0.5,
        +    max_delay: float = 8.0,
        +    retry_on: tuple[type[BaseException], ...] = (ConnectionError, TimeoutError),
        +) -> Callable[[Callable[..., T]], Callable[..., T]]:
        +    """Retry a call with exponential backoff and full jitter."""
        +    if attempts < 1:
        +        raise ValueError("attempts must be at least 1")
        +
        +    def decorator(func: Callable[..., T]) -> Callable[..., T]:
        +        @functools.wraps(func)
        +        def wrapper(*args, **kwargs) -> T:
        +            for attempt in range(1, attempts + 1):
        +                try:
        +                    return func(*args, **kwargs)
        +                except retry_on as exc:
        +                    if attempt == attempts:
        +                        raise
        +                    ceiling = min(max_delay, base_delay * 2 ** (attempt - 1))
        +                    delay = random.uniform(0, ceiling)
        +                    log.warning("%s failed (%s); retrying in %.2fs", func.__name__, exc, delay)
        +                    time.sleep(delay)
        +            raise AssertionError("unreachable")
        +
        +        return wrapper
        +
        +    return decorator
  bugs: []

- id: cr-py-03
