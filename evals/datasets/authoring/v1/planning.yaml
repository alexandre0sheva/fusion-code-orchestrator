- id: plan-24
  category: planning
  difficulty: hard
  split: dev
  tags: [data, performance]
  prompt: |
    Our primary PostgreSQL instance is at 80% CPU, mostly from read queries. Plan introducing read
    replicas and routing reads to them without showing users stale or inconsistent data.
  context: |
    A Go service using `database/sql` with a single connection pool. About 85% of queries are reads,
    but some read-after-write paths exist (a user saves a setting and the next page shows it).
    Managed PostgreSQL with streaming replicas available in the same region. Replica lag is
    usually under 100 ms but spikes to seconds during batch jobs.
  required:
    - text: Adds a second pool for replicas and an explicit way to choose it (read-only transaction or repository method), defaulting to the primary
      gate: true
      keywords: [second pool, replica pool, read pool, explicit, route reads, read-only, default to primary, separate connection]
    - text: Identifies read-after-write paths and keeps them on the primary or uses session stickiness for a short time
      keywords: [read-after-write, read your writes, stickiness, sticky, after a write, primary for, session consistency]
    - text: Monitors replica lag and falls back to the primary when lag exceeds a threshold
      keywords: [replica lag, replication lag, threshold, fall back, fallback to primary, pg_stat_replication, monitor lag]
    - text: Classifies queries and migrates them gradually, starting with safe heavy reads (reports, search, lists)
      keywords: [classify, gradual, start with, heavy read, reports, incremental, per endpoint]
    - text: "Handles failures: replica unavailable, failover, connection limits and pool sizing"
      keywords: [failover, replica down, connection limit, pool size, health check, retry on primary]
    - text: Considers cheaper options in parallel (indexes, query tuning, caching) and measures the effect
      keywords: [index, query tuning, caching, explain, pg_stat_statements, measure, slow queries]
    - text: Tests consistency behaviour and rolls out behind a flag with dashboards
      keywords: [test, feature flag, rollout, dashboard, canary, consistency test]
  forbidden:
    - text: Sends every read to the replicas, including those that follow a write
      keywords: [send all reads to the replica, route every select to replicas]

- id: plan-25
  category: planning
  difficulty: hard
  split: test
  tags: [data, operations]
  prompt: |
    Plan data retention and archival for our 2 TB `events` table, which grows by 60 GB a month and
    is slowing queries and backups. Product only needs the last 90 days online; compliance requires
