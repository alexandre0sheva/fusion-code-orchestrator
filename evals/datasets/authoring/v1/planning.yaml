      keywords: [log in by email match from any provider, trust the email claim unconditionally]

- id: plan-20
  category: planning
  difficulty: hard
  split: test
  tags: [migration, reliability]
  prompt: |
    Plan replacing our homegrown, database-backed job queue (about 3 million jobs a day) with a
    managed queue service, without losing or double-running jobs during the cutover.
  context: |
    Python workers poll a `jobs` table with `SELECT ... FOR UPDATE SKIP LOCKED`. Jobs include payment
    captures that must run exactly once in effect. 25 job types, some scheduled for the future,
    some with priorities. The team can accept a few minutes of added latency but not data loss.
  required:
    - text: Inventories job types and their semantics (idempotency, ordering, scheduling, priority, max runtime) and maps them onto the new service's features
      gate: true
      keywords: [inventory, job types, semantics, idempoten, ordering, priority, delayed, scheduled, map to]
    - text: Makes handlers idempotent (idempotency keys, effect-level dedupe) before moving, since the new queue is at-least-once
      keywords: [idempoten, at-least-once, dedupe, idempotency key, payment capture, effect]
    - text: Uses a dual-publish or outbox-based migration with per-job-type cutover, rather than a big-bang switch
      keywords: [dual publish, dual-publish, outbox, per job type, gradual, canary, strangler, shadow]
    - text: Drains the old queue, handles in-flight and scheduled jobs, and defines how to prevent double execution at the boundary
      keywords: [drain, in-flight, scheduled jobs, double execution, boundary, lock, cutover window, stop enqueuing]
    - text: Plans monitoring (depth, age, failures, dead-letter) and comparison of old vs new throughput and results during the migration
      keywords: [monitor, queue depth, oldest job, dead-letter, compare, metrics, dashboard, parity]
    - text: Defines a rollback path and a reconciliation check for lost jobs
      keywords: [rollback, roll back, reconcil, lost jobs, audit, count, verify]
    - text: Plans cost, limits (message size, visibility timeout, rate limits) and decommissioning the old table
      keywords: [message size, visibility timeout, cost, limits, decommission, remove the table, retention]
  forbidden:
    - text: Switches all producers and workers to the new queue in one deploy with no fallback
      keywords: [switch everything at once, big-bang cutover, flip all job types in one release]

- id: plan-21
  category: planning
  difficulty: hard
  split: dev
  tags: [migration, architecture]
  prompt: |
