- id: plan-18
  category: planning
  difficulty: medium
  split: test
  tags: [feature, scheduling]
  prompt: |
    Plan scheduled and recurring reports: users pick a saved report, a schedule (daily, weekly,
    monthly) and recipients, and receive it by email as a PDF.
  context: |
    Django app on Kubernetes (4 replicas), PostgreSQL, Celery with Redis for background tasks. A
    `SavedReport` model exists and PDF generation (`render_pdf(report)`) takes 5 to 60 seconds.
    Users are in many time zones.
  required:
    - text: Models schedules (cron-like rule, time zone, recipients, enabled, last/next run) and stores the time zone with the schedule
      gate: true
      keywords: [schedule model, cron, rrule, time zone, timezone, next_run, last_run, recipients, enabled]
    - text: Runs a single scheduler that enqueues due runs (Celery beat or a poller), avoiding duplicate runs across replicas
      keywords: [celery beat, scheduler, single instance, select for update, skip locked, advisory lock, duplicate runs, leader]
    - text: Executes each report as an idempotent background task with retries, timeouts and failure notification
      keywords: [idempoten, retry, timeout, failure notification, task, dead-letter, run record]
    - text: Handles daylight-saving transitions and missed runs after downtime (catch-up policy)
      keywords: [daylight, dst, missed run, catch up, catch-up, misfire, downtime]
    - text: "Controls email delivery: recipient validation, attachment size limits, links instead of attachments for large files, unsubscribe"
      keywords: [recipient validation, attachment size, signed link, unsubscribe, bounce, opt out, email limits]
    - text: Applies permissions at run time (the owner's access), and limits schedules per user to protect capacity
      keywords: [permissions at run time, owner access, limit per user, quota, capacity, rate limit, fair]
    - text: Adds a UI to manage schedules and a run history, plus tests with a frozen clock
      keywords: [run history, ui, manage schedules, freezegun, frozen clock, test, time travel]
  forbidden:
    - text: Runs a cron entry on every replica without coordination
      keywords: [every pod runs the cron, run the scheduler in each replica]

- id: plan-19
  category: planning
  difficulty: hard
  split: dev
  tags: [security, migration]
  prompt: |
    Plan moving our monolith's authentication from its own username/password table to an external
    OpenID Connect identity provider (SSO) for enterprise customers, while the existing 60,000
    users keep working.
  context: |
    Java Spring monolith with PostgreSQL. Users log in with email and password (bcrypt). Sessions
    are server-side. A few enterprise customers want SAML/OIDC with their own IdP and automatic
    deprovisioning. Some integrations use long-lived API tokens issued to users.
  required:
    - text: Separates identity from the user record and links external identities (issuer and subject) to existing users with a migration
      gate: true
      keywords: [issuer, subject, sub claim, identity link, external identity, federated identity, linking table, user_identities]
    - text: Implements the OIDC authorisation-code flow with PKCE and validates tokens (signature, issuer, audience, nonce, expiry)
      keywords: [authorization code, pkce, validate the token, audience, nonce, state parameter, jwks, signature]
    - text: Defines account linking and matching rules safely (verified email, no automatic takeover of existing accounts)
      keywords: [verified email, account linking, takeover, match by email, merge accounts, confirm ownership]
    - text: Supports per-tenant IdP configuration and just-in-time provisioning with role mapping
      keywords: [per-tenant, tenant idp, just-in-time, jit provisioning, role mapping, group claims, domain]
    - text: Handles deprovisioning and session lifetime (SCIM or back-channel logout, short sessions, re-check)
      keywords: [scim, deprovision, back-channel logout, session lifetime, revoke, offboarding, disable the user]
    - text: Keeps password login working during the transition, with enforced SSO per tenant later, and a break-glass admin path
      keywords: [keep password login, transition, enforce sso, break-glass, break glass, fallback admin, dual mode]
    - text: Addresses API tokens issued to users (bind to identity state, migration plan) and tests with a staging IdP
