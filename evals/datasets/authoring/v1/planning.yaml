  required:
    - text: Converts to time-based partitioning (by month or week) and explains how to migrate a live 2 TB table without long locks
      gate: true
      keywords: [partition, range partition, by month, by week, pg_partman, migrate online, attach partition, swap, new partitioned table]
    - text: Detaches or drops old partitions instead of running giant deletes, and archives them first to cheap storage in an open format
      keywords: [detach, drop partition, archive, s3, parquet, cold storage, avoid delete, glacier]
    - text: "Meets the 7-year compliance requirement: archive integrity, retrievability and a tested restore or query path"
      keywords: [7 years, compliance, integrity, checksum, retrievable, restore, athena, query the archive, immutable]
    - text: Adapts the queries and the reporting job (partition pruning, queries beyond 90 days use the archive)
      keywords: [partition pruning, pruning, reporting job, query the archive, one year, union, foreign data wrapper]
    - text: Automates the lifecycle (create future partitions, detach and archive old ones) with monitoring and alerts
      keywords: [automate, scheduled job, pg_cron, create future partitions, alert, monitor, lifecycle]
    - text: Handles backups, indexes and storage reclaim (smaller backups, per-partition indexes) and verifies the migration with checks
      keywords: [backup, index, reclaim, vacuum, size, verify, row counts, checksum]
    - text: Plans a staged rollout with a rollback plan and a rehearsal on a copy
      keywords: [rehearse, rehearsal, copy, staging, rollback, staged, dry run]
  forbidden:
    - text: Deletes years of rows with one long DELETE statement on the live table
      keywords: [run a delete from events where, delete the old rows in one statement]
