      gate: true
      keywords: [i18next, react-intl, formatjs, message catalog, translation keys, icu, messageformat, lingui]
    - text: Extracts hard-coded strings incrementally, with tooling to find them and a lint rule to stop new ones
      keywords: [extract, codemod, eslint plugin, lint rule, find hard-coded strings, incrementally, formatjs extract]
    - text: Replaces string concatenation with parameterised, pluralised messages (word order differs by language)
      keywords: [concatenat, plural, interpolation, placeholders, word order, icu]
    - text: Uses Intl APIs for dates, numbers and currencies instead of manual formatting
      keywords: [intl, numberformat, datetimeformat, locale-aware, toLocaleString, currency formatting]
    - text: Handles locale detection, persistence and fallback, plus backend error messages (codes instead of text)
      keywords: [locale detection, accept-language, fallback, error code, persist the language, user preference]
    - text: Sets up the translation workflow (translators, platform, review) and layout/font checks for Japanese and long German text
      keywords: [translation platform, translators, crowdin, lokalise, pseudo-locale, long text, font, layout, cjk]
  forbidden:
