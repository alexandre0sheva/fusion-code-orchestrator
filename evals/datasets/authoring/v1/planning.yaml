    own service, without stopping feature work or breaking invoicing at month end.
  context: |
    A 9-year-old Rails monolith with one PostgreSQL database. Billing code is spread over 40 models;
    other modules read billing tables directly with joins, and several callbacks create invoices.
    Twelve engineers; finance runs month-end close on the 1st.
  required:
