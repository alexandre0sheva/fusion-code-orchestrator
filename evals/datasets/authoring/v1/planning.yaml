# Implementation-planning tasks: a feature or change request in an existing codebase, with a
# checklist rubric (required and forbidden points). See evals/datasets/README.md.

- id: plan-01
  category: planning
  difficulty: easy
  split: dev
  tags: [feature, web]
  prompt: |
    Plan how to add a "Download CSV" button to the monthly sales report page. Users currently only
    see the report as an HTML table. Describe the steps, the files to change and how you would test it.
  context: |
    Flask app. `reports/views.py` has `monthly_report()` which builds a list of row dicts and renders
    `templates/monthly.html`. Reports can have up to 200,000 rows. Customer names can contain commas,
    quotes and non-ASCII characters. Only users with the `finance` role may open reports.
  required:
    - text: Reuses the existing row-building logic in one place instead of duplicating the query
      keywords: [reuse, shared function, same query, extract, refactor, single source, do not duplicate]
    - text: Adds an endpoint (or format parameter) that returns text/csv with a Content-Disposition filename
      gate: true
      keywords: [text/csv, content-disposition, attachment, .csv, export endpoint, format=csv, new route]
    - text: Streams the response so 200,000 rows do not have to fit in memory
      keywords: [stream, generator, iterator, chunk, yield, server-side cursor, without loading]
    - text: Uses a CSV library to escape commas, quotes and newlines and writes UTF-8 (optionally with a BOM for Excel)
      keywords: [csv module, csv.writer, escape, quoting, utf-8, bom, encoding]
    - text: Applies the same authorisation (finance role) to the new endpoint
      keywords: [authoriz, permission, role, finance, access control, login_required, same decorator]
    - text: Guards against CSV/formula injection in cells that start with =, +, - or @
      keywords: [formula injection, csv injection, starts with =, prefix with a quote, sanitize cells]
    - text: Adds tests for escaping, headers, permissions and a large export
      keywords: [test, unit test, integration test, fixture, assert]
  forbidden:
    - text: Builds the whole CSV as one string by concatenation in memory with no escaping
      keywords: ["join the fields with commas", "concatenate the strings with commas", "f\"{a},{b}\""]

- id: plan-02
  category: planning
  difficulty: easy
  split: dev
  tags: [feature, security]
  prompt: |
    Plan the implementation of a "forgot password" flow (email a reset link) for our web app, which
    currently has login with email and password only.
  context: |
    Node.js with Express and PostgreSQL. Users are in a `users` table (`id`, `email`, `password_hash`
    using bcrypt). Email is sent through a helper `lib/mailer.ts` (SendGrid). There is no existing
    token or reset table. About 30,000 users.
  required:
    - text: Generates a cryptographically random, single-use, expiring token and stores only a hash of it
      gate: true
      keywords: [random token, crypto.randomBytes, single-use, one-time, expir, hash of the token, store the hash, sha-256]
    - text: Adds a table or columns for reset tokens with an expiry and used timestamp (migration)
      keywords: [migration, password_resets, reset table, new table, expires_at, used_at, schema]
    - text: "Avoids user enumeration: the same response whether or not the email exists"
      keywords: [enumeration, same response, do not reveal, generic message, regardless of whether]
    - text: Rate-limits reset requests per account and IP
      keywords: [rate limit, throttle, per ip, per account, captcha, abuse]
    - text: On reset, validates the token, sets a new bcrypt hash, invalidates the token and existing sessions
      keywords: [invalidate, existing sessions, log out other, revoke sessions, set the new password, bcrypt]
    - text: Sends the link over HTTPS from a configured base URL and does not log the token
      keywords: [https, base url, do not log, not in logs, referrer, link]
    - text: Adds tests for expiry, reuse and unknown email
      keywords: [test, expired token, reuse, unknown email, integration]
  forbidden:
    - text: Emails the user's current or a newly generated password in plaintext
      keywords: [email the password, send the new password in the email, send the current password]

- id: plan-03
  category: planning
  difficulty: easy
  split: test
  tags: [feature, frontend]
  prompt: |
    Plan adding a dark mode to our React web app, including remembering the user's choice. Cover
    what to change and how to verify it.
  context: |
    React 18 with TypeScript, styled with a single global `styles/app.css` that uses hard-coded hex
    colours in about 400 rules, plus a handful of inline styles in `components/Chart.tsx`. Users are
    logged in; preferences are not yet stored on the server.
  required:
    - text: Introduces CSS custom properties (design tokens) for colours and replaces hard-coded values
      gate: true
      keywords: [css variable, custom propert, design token, --color, var(--, theme tokens]
    - text: Defines a dark palette and switches it with a data attribute or class on the root element
      keywords: [data-theme, class on the root, html element, prefers-color-scheme, dark palette, theme attribute]
    - text: Respects the operating-system preference by default and lets the user override it
      keywords: [prefers-color-scheme, system preference, os setting, default to, override, toggle]
    - text: Persists the choice (localStorage, cookie or user profile) and applies it before first paint to avoid a flash
      keywords: [localstorage, persist, cookie, flash, before first paint, inline script, fouc]
    - text: "Handles the places CSS cannot reach: inline styles, chart colours and images/logos"
      keywords: [chart, inline style, svg, logo, canvas, image, third-party]
    - text: Checks contrast and accessibility in both themes and tests visually
      keywords: [contrast, wcag, accessib, visual regression, screenshot, storybook, manual check]
  forbidden:
    - text: Duplicates the whole stylesheet as a second hard-coded copy for dark mode
      keywords: [copy the whole css file, duplicate the stylesheet, second stylesheet with hard-coded]

- id: plan-04
  category: planning
  difficulty: easy
  split: dev
  tags: [api, performance]
  prompt: |
    The `GET /api/invoices` endpoint returns every invoice for a customer in one response and some
    customers now have 50,000 of them. Plan the change to add pagination without breaking existing clients.
  context: |
    Python FastAPI service, PostgreSQL, `invoices` table with `id` (UUID), `customer_id`, `created_at`.
    Two internal clients (a web app and a mobile app) call the endpoint; the mobile app updates
    slowly. Results are sorted by `created_at` descending.
  required:
    - text: Chooses cursor (keyset) pagination, or justifies offset pagination, and defines the response shape (items, next cursor)
      gate: true
      keywords: [keyset, cursor, seek method, offset, next_cursor, next page token, limit]
    - text: Uses a stable sort with a tie-breaker (created_at plus id) and an index that supports it
      keywords: [tie-breaker, tiebreaker, created_at, composite index, (customer_id, created_at, id), stable order, index]
    - text: "Keeps old clients working: default page size or opt-in parameter, versioning, or a deprecation period"
      keywords: [backward compatible, backwards compatible, existing clients, default limit, opt-in, deprecat, version]
    - text: Sets a sensible default and maximum page size and validates parameters
      keywords: [max page size, maximum, default limit, validate, 100, clamp]
    - text: Updates the web and mobile clients and documentation (OpenAPI)
      keywords: [openapi, docs, update the client, web app, mobile app, release notes]
    - text: "Tests boundaries: empty result, exactly one page, rows inserted during paging, invalid cursor"
      keywords: [test, empty, boundary, invalid cursor, inserted during, edge case]
  forbidden:
    - text: Loads all rows and slices them in application memory
      keywords: [slice the list in python, load everything then paginate, paginate in memory]

- id: plan-05
  category: planning
  difficulty: easy
  split: test
  tags: [observability]
  prompt: |
    Plan adding structured logging with a request id to our API service so that support can follow
    one request through the logs. Today the code uses scattered `print` and `logging.info` calls
    with free-form strings.
  context: |
    Python/Flask service with about 60 endpoints, deployed as 4 containers, logs shipped to a
    central log store that can parse JSON. A second internal service is called over HTTP from some
    handlers.
  required:
    - text: Configures one logging setup that emits JSON (timestamp, level, message, logger, request id)
      gate: true
      keywords: [json log, structured log, jsonformatter, structlog, python-json-logger, single configuration, dictconfig]
    - text: Generates or accepts an incoming request id in middleware and attaches it to every log line (contextvars or logging filter)
      keywords: [request id, x-request-id, correlation id, middleware, contextvar, logging filter, before_request]
    - text: Propagates the request id to downstream HTTP calls and returns it in a response header
      keywords: [propagate, downstream, outgoing request, response header, forward the header, x-request-id]
    - text: Replaces print and ad-hoc strings incrementally, with a lint or review rule to stop regressions
      keywords: [replace print, incrementally, lint, ruff, grep, convention, review]
    - text: Keeps secrets and personal data out of logs (redaction)
      keywords: [redact, secrets, pii, personal data, sensitive, mask, do not log]
    - text: Verifies in tests and with a sample query in the log store, and sets log levels per environment
      keywords: [test, caplog, log level, per environment, dashboard, query in the log, verify]
  forbidden:
    - text: Logs full request and response bodies, including credentials, at INFO
      keywords: [log the full request body, log every request body, dump the entire payload]

- id: plan-06
  category: planning
  difficulty: easy
  split: dev
  tags: [feature, compliance]
  prompt: |
    Plan an admin audit log: a record of who changed what in the app (user roles, pricing rules,
    feature settings), viewable by administrators.
  context: |
    Django monolith with about 12 models, PostgreSQL, Django admin plus a custom React admin that
    calls DRF endpoints. Changes can come from the API, the Django admin and management commands.
    Auditors ask for records to be kept for 2 years.
  required:
    - text: "Defines what is recorded: actor, timestamp, action, object type and id, and before/after values"
      gate: true
      keywords: [actor, who, timestamp, before and after, old value, new value, diff, object id, action]
    - text: Captures changes at a single choke point (model signals, a mixin, or a library such as django-simple-history) so no path is missed
      keywords: [signal, post_save, mixin, simple-history, django-simple-history, middleware, central place, single place]
    - text: Records the actor for API, admin and management-command changes (including system actors)
      keywords: [request.user, thread-local, contextvar, management command, system user, service account, actor for]
    - text: Stores entries append-only in their own table with indexes for browsing and keeps them for the required retention
      keywords: [append-only, append only, audit table, index, retention, 2 years, partition, immutable]
    - text: Adds a read-only admin view with filtering and pagination, restricted to administrators
      keywords: [read-only, filter, pagination, administrators only, permission, admin view]
    - text: Excludes secrets such as password hashes from recorded values
      keywords: [exclude, password, secret, redact, sensitive fields, mask]
    - text: Tests that each entry point writes an entry
      keywords: [test, assert, each entry point, api, admin, command]
  forbidden:
    - text: Relies on application logs as the audit trail
      keywords: [just grep the application logs, the logs are the audit trail]

- id: plan-07
  category: planning
  difficulty: easy
  split: dev
  tags: [feature, frontend, performance]
  prompt: |
    Plan search-as-you-type for the customer list in our admin UI. Today the page loads all
    customers (about 25,000) and filters them in the browser, which is slow to open.
  context: |
    React front-end, Go backend with PostgreSQL. `GET /api/customers` returns everything. Staff search
    by name, email or company, often with typos or partial words.
  required:
    - text: Moves search to the server with a query parameter and a limited result set
      gate: true
      keywords: [server-side search, query parameter, ?q=, limit, backend search, search endpoint]
    - text: Debounces input and cancels or ignores stale in-flight requests
      keywords: [debounce, cancel, abortcontroller, stale response, out-of-order, latest request wins]
    - text: Adds database support for partial and fuzzy matches (pg_trgm or an ILIKE with an index)
      keywords: [pg_trgm, trigram, gin, ilike, index, full-text, prefix]
    - text: Handles loading, empty and error states and keyboard accessibility
      keywords: [loading state, empty state, error state, keyboard, aria, accessib, no results]
    - text: Sets a minimum query length and a maximum result count, and escapes wildcard characters
      keywords: [minimum length, min length, max results, escape, wildcard, sanitize]
    - text: Tests the endpoint and the component, including rapid typing
      keywords: [test, rapid typing, race condition, jest, testing-library, integration]
  forbidden:
    - text: Keeps loading all customers to the browser and only optimises the filter loop
      keywords: [keep loading all customers, just memoize the filter]

- id: plan-08
  category: planning
  difficulty: easy
  split: test
  tags: [ops, reliability]
  prompt: |
    Our service drops in-flight requests during Kubernetes deploys, and the load balancer
    sometimes sends traffic to pods that are still starting. Plan the changes to fix both.
  context: |
    A Go HTTP service on Kubernetes (3 replicas, rolling updates). It connects to PostgreSQL and
    Redis at startup and takes up to 20 seconds to warm a cache. The Deployment has no probes today.
  required:
    - text: Adds a readiness endpoint that reports ready only after dependencies and warm-up are done
      gate: true
      keywords: [readiness, readinessprobe, /ready, /readyz, ready only after, warm-up complete]
    - text: Adds a liveness probe that is cheap and does not depend on external services
      keywords: [liveness, livenessprobe, /healthz, /livez, do not check the database, cheap]
    - text: Handles SIGTERM with graceful shutdown (stop accepting, drain in-flight requests with a deadline)
      keywords: [sigterm, graceful shutdown, server.shutdown, drain, in-flight, context with timeout]
    - text: "Coordinates with Kubernetes: terminationGracePeriodSeconds, a preStop sleep or readiness flip, and rolling-update settings"
      keywords: [terminationgraceperiodseconds, prestop, maxunavailable, maxsurge, endpoints removal, rolling update]
    - text: Adds a startup probe or initial delay for the slow warm-up
      keywords: [startupprobe, startup probe, initialdelayseconds, slow start, warm]
    - text: Verifies by deploying under load and watching error rates
      keywords: [load test, deploy under load, error rate, verify, vegeta, k6, hey]
  forbidden:
    - text: Makes the liveness probe check the database so that a database outage restarts every pod
      keywords: [liveness probe should check the database, restart pods when the database is down]

- id: plan-09
  category: planning
  difficulty: medium
  split: dev
  tags: [feature, security]
  prompt: |
    Plan adding optional TOTP two-factor authentication (authenticator apps) to our web app, with
    recovery codes.
  context: |
    Rails app with Devise, PostgreSQL. 80,000 users, some are admins who should eventually be
    required to use 2FA. The app also has an API authenticated with personal access tokens.
  required:
    - text: Adds secret storage (encrypted at rest) and enrolment with a QR code and confirmation of a first valid code
      gate: true
      keywords: [qr code, otpauth, enrol, enroll, confirm a code, encrypted secret, encrypt the secret, rotp]
    - text: Verifies TOTP codes with a small time window, prevents code reuse and rate-limits attempts
      keywords: [time window, drift, reuse, replay, last used, rate limit, lockout, brute force]
    - text: Generates single-use recovery codes, stored hashed, and a regeneration flow
      keywords: [recovery code, backup code, single-use, hashed, regenerate]
    - text: Integrates with login (second step after the password) and with session handling
      keywords: [second step, after the password, devise, two-factor step, session, partial login]
    - text: Decides how API tokens and other login paths (SSO, remember-me) interact with 2FA
      keywords: [personal access token, api token, sso, remember me, remember-me, other login paths, bypass]
    - text: Plans a safe disable and lost-device process, with identity verification
      keywords: [lost device, disable, reset 2fa, identity verification, support process, admin reset]
    - text: Plans rollout (opt-in, then required for admins), migration and tests
      keywords: [opt-in, require for admins, rollout, enforce, feature flag, test, migration]
  forbidden:
    - text: Stores the TOTP secret in plaintext or logs codes
      keywords: [store the secret in plaintext, log the code]

- id: plan-10
  category: planning
  difficulty: medium
  split: dev
  tags: [feature, security]
  prompt: |
    Our app has a single boolean `is_admin` on users. Product wants roles (viewer, editor, billing,
    admin) with permissions per project. Plan the move to role-based access control.
  context: |
    Spring Boot (Java 17) with PostgreSQL and a React front-end. Authorisation is currently done with
    `if (user.isAdmin())` checks in about 140 places across controllers and services. Roles apply
    per project; a user can have different roles in different projects.
  required:
    - text: Models roles, permissions and per-project role assignments in the database with a migration
      gate: true
      keywords: [role table, permission, project_members, membership, role assignment, schema, migration, join table]
    - text: Centralises permission checks in one policy layer instead of scattering conditionals
      keywords: ["policy", "central", "permission evaluator", "@preauthorize", "authorization service", "single place", "method security"]
    - text: Inventories the existing 140 `isAdmin` checks and migrates them gradually, mapping each to a permission
      keywords: [inventory, audit the checks, grep, 140, map each, incremental, gradually, strangler]
    - text: Maps existing admins to the admin role and keeps behaviour identical at cutover (data migration, compatibility shim)
      keywords: [backfill, existing admins, compatibility, shim, keep is_admin, equivalent behaviour, data migration]
    - text: Enforces the same rules on the server for the API, and uses the front-end only for hiding UI
      keywords: [server-side enforcement, never trust the client, api enforcement, ui only hides, front-end hiding]
    - text: Tests the permission matrix, including cross-project access and privilege escalation
      keywords: [permission matrix, test, cross-project, escalation, negative test, deny by default]
    - text: Adds an audit trail for role changes
      keywords: [audit, log role changes, history, who granted]
  forbidden:
    - text: Hides forbidden actions only in the UI without server-side checks
      keywords: [hide the buttons is enough, ui checks are sufficient]

- id: plan-11
  category: planning
  difficulty: medium
  split: test
  tags: [realtime, architecture]
  prompt: |
    Our web app polls `/api/notifications` every five seconds from 20,000 open tabs, which loads
    the API and the database. Plan the move to server-sent events (SSE) for notifications.
  context: |
    Node.js API on three instances behind an nginx load balancer, PostgreSQL, Redis. Notifications are
    created by several services. Browsers must keep working behind corporate proxies and mobile
    networks; missed notifications are not acceptable.
  required:
    - text: Adds an SSE endpoint with authentication, correct headers and heartbeats to keep connections alive
      gate: true
      keywords: [text/event-stream, sse endpoint, eventsource, heartbeat, keep-alive, comment line, authenticat]
    - text: Uses Redis pub/sub (or similar) so that events reach the instance that holds the user's connection
      keywords: [redis, pub/sub, pubsub, fan-out, message bus, broadcast between instances]
    - text: Supports resuming after reconnect with Last-Event-ID and server-side storage of recent events, so none are missed
      keywords: [last-event-id, resume, replay, missed notifications, event id, cursor, since]
    - text: Configures nginx and proxies for long-lived streaming connections (buffering off, timeouts)
      keywords: [proxy_buffering, buffering, timeout, nginx, proxy_read_timeout, http/2, connection limit]
    - text: Keeps a polling fallback and rolls out gradually with a flag
      keywords: [fallback, polling, feature flag, gradual, percentage, rollout]
    - text: Plans capacity (connections per instance, file descriptors) and verifies with a load test
      keywords: [connections per instance, file descriptors, capacity, load test, memory, ulimit]
  forbidden:
    - text: Removes polling for all users in one release with no fallback
      keywords: [remove polling immediately for everyone, switch everyone at once]

- id: plan-12
  category: planning
  difficulty: medium
  split: dev
  tags: [feature, payments]
  prompt: |
    Plan adding multi-currency pricing (USD, EUR, GBP) to our shop, which has only ever sold in USD.
  context: |
    Django shop with PostgreSQL. `Product.price` is a DecimalField in USD; orders store `total`
    in USD; payments go through Stripe. Finance exports monthly reports in USD. Roughly 5% of
    traffic is from Europe and the UK.
  required:
    - text: Decides how prices are stored (explicit per-currency prices vs conversion) and stores money as integer minor units or fixed decimals with a currency code
      gate: true
      keywords: [per-currency price, price table, minor units, cents, currency code, decimal, iso 4217, price list]
    - text: Defines where exchange rates come from and when they are locked (at order time) if conversion is used
      keywords: [exchange rate, fx rate, rate source, lock the rate, snapshot the rate, conversion at order time]
    - text: Stores the currency and the amounts on orders and payments so that history stays correct
      keywords: [order currency, store the currency, immutable, historical, snapshot, payment currency]
    - text: Handles rounding and display per currency (decimal places, formatting, tax-inclusive pricing)
      keywords: [rounding, decimal places, locale, format, vat, tax-inclusive, jpy]
    - text: Updates Stripe usage (currency per charge, refunds in the original currency)
      keywords: [stripe, charge currency, refund, presentment currency, payment intent]
    - text: Updates reporting for finance (per currency and converted totals) and migrates existing data
      keywords: [reporting, finance, report, backfill, migrate existing, default usd, converted totals]
    - text: Rolls out gradually with tests around cart, checkout and refunds
      keywords: [test, rollout, feature flag, staged, cart, checkout]
  forbidden:
    - text: Stores prices as floating-point numbers
      keywords: [use floats for the prices, float field for money]

- id: plan-13
  category: planning
  difficulty: medium
  split: test
  tags: [feature, api, security]
  prompt: |
    Plan adding per-user API keys with rate limits so that customers can call our API from their
    own scripts. Today the API only accepts browser sessions.
  context: |
    FastAPI service with PostgreSQL and Redis, 5,000 active customers, three plans with different
    request limits. Keys must be revocable, and customers must be able to see when a key was last used.
  required:
    - text: Generates high-entropy keys shown once, with a prefix for identification, and stores only a hash
      gate: true
      keywords: [shown once, show once, hash, prefix, high entropy, secrets.token, store only the hash, sha-256]
    - text: Adds a keys table with owner, name, scopes, created, last used and revoked columns
      keywords: [api_keys, keys table, scopes, last_used, revoked, name, expires_at, schema, migration]
    - text: Authenticates keys in middleware or a dependency, with scope checks and constant-time comparison
      keywords: [middleware, dependency, bearer, authorization header, scope, constant-time, compare_digest]
    - text: Enforces per-plan rate limits (Redis counters) and returns 429 with headers
      keywords: [rate limit, redis, token bucket, 429, retry-after, per plan, quota]
    - text: Provides self-service UI or endpoints to create, list and revoke keys with immediate effect
      keywords: [create, list, revoke, immediate, ui, self-service, rotate]
    - text: Handles last-used tracking without a database write per request, and monitors abuse
      keywords: [batch, async update, throttle the update, last used, abuse, anomaly, alert, usage metrics]
    - text: Documents and tests the feature (including leaked-key guidance)
      keywords: [docs, documentation, test, secret scanning, leaked key, github secret scanning]
  forbidden:
    - text: Stores the keys in plaintext so support can read them back
      keywords: [store the key in plaintext, so support can look up the key]

- id: plan-14
  category: planning
  difficulty: medium
  split: dev
  tags: [data, tooling]
  prompt: |
    Our schema is managed by hand: engineers paste SQL into production from a wiki page. Plan the
    introduction of a proper migration tool without disrupting current work.
  context: |
    A Node.js service with PostgreSQL in three environments (dev, staging, production). There is a
    `schema.sql` that is often out of date. 8 engineers, deploys several times a day through
    GitHub Actions.
  required:
    - text: Picks a migration tool (Flyway, Liquibase, Knex, Prisma Migrate, Alembic or similar) with stated criteria
      gate: true
      keywords: [flyway, liquibase, knex, prisma, alembic, sqitch, node-pg-migrate, dbmate, migration tool]
    - text: Creates a baseline migration from the actual production schema and verifies that all environments match it
      keywords: [baseline, pg_dump --schema-only, schema diff, drift, snapshot of production, match production, verify the schema]
    - text: Runs migrations automatically in CI/CD before the app deploy, with locking against concurrent runs
      keywords: [ci, pipeline, github actions, before the deploy, advisory lock, automatic, deploy step]
    - text: Defines rules for safe migrations (backward compatible, no long locks, expand/contract) and review
      keywords: [backward compatible, expand and contract, expand-contract, lock, review, linter, safe migration, squawk]
    - text: Plans rollback or roll-forward strategy and backups before risky changes
      keywords: [rollback, roll-forward, roll forward, down migration, backup, restore]
    - text: Retires the manual process (wiki, direct production access) and communicates the change
      keywords: [retire, wiki, remove direct access, permissions, communicate, documentation, announce]
  forbidden:
    - text: Regenerates the production schema from an ORM synchronise mode on startup
      keywords: [use synchronize true in production, auto-sync the schema on startup]

- id: plan-15
  category: planning
  difficulty: medium
  split: dev
  tags: [feature, security, storage]
  prompt: |
    Plan adding file attachments (PDF, images, up to 25 MB) to support tickets, visible to the
    customer and to agents.
  context: |
    Ruby on Rails app on AWS, PostgreSQL, S3 available. Tickets belong to organisations; agents see
    all tickets, customers only their own organisation's. Some customers are in regulated industries.
  required:
    - text: Stores files in private object storage (not the app server or database) with direct or proxied upload and a size limit
      gate: true
      keywords: [s3, object storage, active storage, private bucket, direct upload, presigned, size limit, 25 mb]
    - text: Validates type and size on the server (content sniffing, allow-list), not just by extension
      keywords: [allow-list, allowlist, content type, mime sniff, magic bytes, validate, extension]
    - text: Scans uploads for malware and holds them until clean
      keywords: [virus, malware, clamav, scan, quarantine, hold until clean]
    - text: Authorises downloads per ticket and organisation using short-lived signed URLs or an authenticated proxy
      keywords: [authoriz, signed url, short-lived, expiring url, access check, organisation, per ticket]
    - text: Serves files safely (Content-Disposition attachment, nosniff, separate domain) to prevent stored XSS
      keywords: [content-disposition, nosniff, separate domain, stored xss, sandbox, attachment header]
    - text: Plans retention, deletion with the ticket, and backups or encryption for regulated customers
      keywords: [retention, delete with the ticket, encryption at rest, sse, kms, lifecycle, gdpr]
    - text: Adds tests and UI states for upload progress, errors and rejection
      keywords: [test, progress, error, rejected, ui, drag and drop]
  forbidden:
    - text: Saves uploads into a public web directory under the user's original file name
      keywords: [save them in the public folder, keep the original filename in the public directory]

- id: plan-16
  category: planning
  difficulty: medium
  split: test
  tags: [data, feature]
  prompt: |
    Plan implementing soft delete with restore for projects, tasks and comments, replacing the
    current hard deletes. Users have asked for an "undo" and a trash view.
  context: |
    Laravel (PHP 8) app with MySQL, about 25 tables related by foreign keys with ON DELETE CASCADE.
    There is a nightly report that counts tasks and a unique index on `projects(slug)`. A privacy
    policy promises permanent deletion within 30 days of a user's request.
  required:
    - text: Adds a `deleted_at` column (or equivalent) and applies it with a model-level scope so deleted rows are hidden by default
      gate: true
      keywords: [deleted_at, softdeletes, soft delete, global scope, default scope, withtrashed, hidden by default]
    - text: "Handles cascades explicitly: deleting a project hides its tasks and comments, and restoring brings back the right ones"
      keywords: [cascade, children, restore the children, deleted together, same timestamp, related records, dependent]
    - text: Fixes unique constraints and reports that soft-deleted rows would break (slug reuse, counts, joins)
      keywords: [unique index, slug, partial index, reuse, report, counts, joins, nightly report]
    - text: Adds a trash view and restore action with permissions
      keywords: [trash, restore, undo, permission, recently deleted, ui]
    - text: Adds a purge job that permanently deletes after a retention period, honouring the 30-day privacy promise
      keywords: [purge, permanently delete, retention, 30 days, scheduled job, privacy, force delete]
    - text: Migrates safely (backfill, no long table locks) and tests restore and cascade behaviour
      keywords: [migration, online schema change, lock, backfill, test, restore test]
  forbidden:
    - text: Keeps soft-deleted personal data forever
      keywords: [keep soft-deleted data forever, never purge]

- id: plan-17
