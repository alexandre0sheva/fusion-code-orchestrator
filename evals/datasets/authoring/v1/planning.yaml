      gate: true
      keywords: [map the dependencies, coupling, inventory, dependency graph, joins, callbacks, find usages, boundary]
    - text: Introduces the boundary inside the monolith first (module, interface, anti-corruption layer) and removes direct table access incrementally
      keywords: [modular, inside the monolith first, interface, anti-corruption, facade, strangler, packwerk, remove direct]
    - text: "Plans the data move: new database, migration, replication or dual-write period, with verification and a cutover"
      keywords: [data migration, replication, dual write, dual-write, cutover, verify, reconcile, separate database]
    - text: Addresses consistency across the new boundary (events, outbox, idempotency, eventual consistency for reads)
      keywords: [outbox, event, idempoten, eventual consistency, async, saga, consistency]
    - text: Schedules around month-end close and has rollback or freeze rules
      keywords: [month-end, month end, close, freeze, rollback, avoid the 1st, schedule around]
    - text: Plans team ownership, API contracts and contract tests, and observability of the new service
      keywords: [ownership, contract test, api contract, observability, monitoring, on-call, slo]
    - text: Treats the extraction as staged milestones with measurable exit criteria
      keywords: [milestone, phase, exit criteria, incremental, stage, measurable]
  forbidden:
