# Per-task settings. Which models answer and aggregate is set by strategies (strategies.yaml).
policies:
  code_review:
    task_type: code_review
    judge_model: gemini-flash
    min_context_score: 0.3

  debugging:
    task_type: debugging
    judge_model: gemini-flash
    min_context_score: 0.3

  architecture_decision:
    task_type: architecture_decision
    judge_model: gemini-flash
    min_context_score: 0.4

  implementation_plan:
    task_type: implementation_plan
    judge_model: gemini-flash
    min_context_score: 0.3

  answer_eval:
    task_type: answer_eval
    judge_model: gemini-flash
    min_context_score: 0.2

  default:
    task_type: default
    judge_model: gemini-flash
    min_context_score: 0.2

budgets:
  default_max_cost_usd: 1.0
  default_max_latency_ms: 120000
  warn_cost_usd: 0.5

fanout:
  max_concurrency: 6
  per_model_timeout_seconds: 45
  global_timeout_seconds: 60
  min_successful_responses: 2
  cancel_on_global_timeout: true
  allow_partial_results: true
  # Latency controls (on by default; set either to false to switch it off, or per strategy and
  # benchmark arm with `fanout:`). Early return stops waiting for stragglers once `quorum` answers
  # are in; `grace_ms: auto` waits for the next straggler only if its measured speed (catalog
  # observed_*) says it will finish within max_grace_ms.
  early_return: {quorum: 2, grace_ms: auto, max_grace_ms: 1000}
  # Also ask a same-tier model when a member has not answered after this long.
  hedge_after_ms: 15000
  # Anthropic prompt-cache breakpoints on the shared prompt prefix: auto | always | off.
  prompt_cache: auto

# Peer-refinement round controls; how many rounds run is a strategy's `rounds`.
refinement:
  per_model_timeout_seconds: 45
  global_timeout_seconds: 60
  min_panel_size: 2
  skip_above_agreement: 0.8

# Identical-request answer cache (real mode, in the memory of one server process). Off by default:
# a repeated request within ttl_seconds returns the earlier answer without calling any model.
cache:
  enabled: false
  ttl_seconds: 900
  max_entries: 128
