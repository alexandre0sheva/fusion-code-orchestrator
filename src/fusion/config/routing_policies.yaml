# Per-task settings. Which models answer and aggregate is set by strategies (strategies.yaml).
policies:
  code_review:
    task_type: code_review
    judge_model: gemini-flash
    min_context_score: 0.3

  debugging:
    task_type: debugging
    judge_model: gemini-flash
    min_context_score: 0.3

  architecture_decision:
    task_type: architecture_decision
    judge_model: gemini-flash
    min_context_score: 0.4

  implementation_plan:
    task_type: implementation_plan
    judge_model: gemini-flash
    min_context_score: 0.3

  answer_eval:
    task_type: answer_eval
    judge_model: gemini-flash
    min_context_score: 0.2

  default:
    task_type: default
    judge_model: gemini-flash
    min_context_score: 0.2

budgets:
  default_max_cost_usd: 1.0
  default_max_latency_ms: 120000
  warn_cost_usd: 0.5

fanout:
  max_concurrency: 6
  per_model_timeout_seconds: 45
  global_timeout_seconds: 60
  min_successful_responses: 2
  cancel_on_global_timeout: true
  allow_partial_results: true

# Peer-refinement round controls; how many rounds run is a strategy's `rounds`.
refinement:
  per_model_timeout_seconds: 45
  global_timeout_seconds: 60
  min_panel_size: 2
