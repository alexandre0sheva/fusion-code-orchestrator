# Strategies: declarative arms. A strategy says who answers, for how many rounds, who aggregates
# and whether a judge scores the answers. Models are catalog aliases (catalog.yaml).
#
# kind: solo   one model answers; the answer is returned as is (one call, no synthesis)
# kind: panel  several models answer; `rounds` > 1 adds peer-refinement rounds; then `aggregator`
#              merges the answers:
#                llm      one synthesizer call
#                digest   no call; the answers and claim clusters go to Claude Code to merge
#                vote     no call; keep only the points a majority of the models backed
#                best_of  no call; return the answer the other models agree with most
#                verified benchmark only, coding tasks: no call; run each panelist's patch against
#                         the task's visible tests and return the best one. It runs code, so it
#                         is refused outside `fusion bench` (the MCP tools never run code)
#                union    no call; every member's findings added together, duplicates merged, and
#                         each checked against the input by string match: a finding whose quote
#                         or cited line is in the input is kept, one whose quote or file is not
#                         is dropped, one that quotes nothing is kept as "not checked". For lenses
#                union+check  union, plus one cheap call (aggregator_model) that rules on the
#                         "not checked" findings; a confirmation counts only with a quote that
#                         passes the same string match
#                select   one cheap call (aggregator_model, at most 400 output tokens) picks the
#                         best of the members' whole answers, shown as anonymous candidates c1..cN
#                         in an order shuffled by the run id; the chosen answer is returned as
#                         written. For answers that are rivals (plans, decisions, asks, patches);
#                         members then answer from different `approaches` (approaches.yaml). A
#                         choice that is not an id falls back to a vote, with a warning
#                select+patch  select, plus up to 3 short points other candidates cover and the
#                         chosen one lacks, appended after it (a cheap union without a rewrite)
#                auto     the default: settled per task. code_review and debugging -> union (with
#                         lenses); implementation_plan, architecture_decision, asks and patches
#                         -> select+patch (with approaches)
# lenses       auto | off. auto: on a task type that has lenses (lenses.yaml: code review,
#              debugging, plans, architecture) each member covers one area and reports only on
#              it, so the answers are pieces of one result. Unset means auto for a panel whose
#              aggregator keeps every piece (llm, digest, union, union+check), off otherwise
#              (vote, best_of and verified keep only what several answers share, or one answer).
#              On a lensed run the panel waits for every member (no early return: each covers
#              an area nobody else does), agreement leaves out the points only one lens could
#              see, and a vote or best_of fallback becomes union. A member may name its `lens`;
#              a model may be listed more than once only with lenses (each copy takes another
#              lens; a copy with no lens left for the task type is not asked)
# approaches   auto | off. auto: with a select aggregator every member answers the WHOLE task from
#              its own approach (approaches.yaml: plans: smallest change, cleanest design, safest
#              rollout; ...), so the rival answers differ. Unset means auto for a select panel.
#              A member may name its `approach`. Lenses and select never combine (a lens answers
#              one area, so there would be no whole answer to pick): such a strategy is refused
# kind: auto   no members: estimate the request's difficulty and start on the matching rung of
#              the escalation ladder (routing_policies.yaml, `routing.escalation`), whose rungs
#              name the strategies that answer; climb a rung only when the answer shows it is not
#              enough (low self-check confidence, low agreement, no acceptable candidate, no
#              finding the input backs, every patch failing, a lost quorum). A higher rung reuses
#              every lower rung's answers. `escalation: {allow_frontier, max_rungs}` changes the
#              ladder for one strategy. `auto` is the default (`budget: medium`)
# self_check   true: each member is asked to check its answer against the input and report an
#              honest confidence (rung 0's self-check; the ladder climbs when it is low)
# kind: cascade  the `cascade.first` cheapest members answer first; if they agree (agreement >=
#              `cascade.agreement_threshold`, nothing disputed, task not high risk) the run ends
#              there with `cascade.early_aggregator` (vote | best_of) and no synthesis call;
#              otherwise the other members answer too and `rounds` and `aggregator` apply
# skip_aggregator  {agreement_threshold, use: vote | best_of}: with an llm aggregator, skip the
#              synthesis call when the answers agree that much (nothing disputed, task not high
#              risk) and build the answer with `use` instead
# speed        fast | balanced (default): `fast` ranks members by measured speed (catalog
#              observed_*), so a cascade's first wave and a panel cut by max_models are the
#              fastest; `balanced` keeps the configured order (a cascade goes cheapest first)
# fanout       {early_return, hedge_after_ms}: this strategy's latency controls on top of the
#              routing policy's (`off` switches one off)
# max_cost_usd  hard cap: a run forecast over it is shifted down (no refinement/judge, smaller
#              panel, cheapest model alone) and refused if even that is over; optional stages
#              that would pass it are skipped. max_latency_s skips stages that would not fit.
# Model tiers (nano, low, medium, high, premium) are computed from catalog prices; see
# `fusion models list`.
# judge: off   deterministic checks only, no judge calls (default)
#        light the LLM judge scores each answer
#        full  light, plus a check of the judge's own output

strategies:
  auto:
    kind: auto
    description: >-
      The default. Estimates how hard the request is and starts on the matching rung of the
      escalation ladder: one nano model with a self-check (easy), the nano panel (normal), the mid
      panel (hard). Climbs a rung only when the answer shows it is not enough, reusing what the
      lower rungs produced. Never uses the frontier rung.
  auto-frontier:
    kind: auto
    description: >-
      `auto` with the frontier rung (Claude Opus 5.5 alone) allowed above the mid panel, for
      requests worth frontier prices when the cheaper rungs fall short.
    escalation: {allow_frontier: true}

  solo-haiku-check:
    kind: solo
    description: >-
      Claude Haiku 5.5 alone, asked to check its answer and report an honest confidence; rung 0
      of the `auto` ladder (nano tier).
    members:
      - model: claude-haiku
    self_check: true

  # One solo strategy per catalog model: solo-<model>.
  solo-opus:
    kind: solo
    description: Claude Opus 5.5 alone; the quality baseline (high tier).
    members:
      - model: claude-opus

  solo-sol:
    kind: solo
    description: GPT-6.2 Sol alone; the second frontier-class baseline (medium tier).
    members:
      - model: gpt-sol

  solo-haiku:
    kind: solo
    description: Claude Haiku 5.5 alone; the cheap single-model baseline (nano tier).
    members:
      - model: claude-haiku

  solo-luna:
    kind: solo
    description: GPT-6 Luna alone; a nano-tier single model from a second vendor.
    members:
      - model: gpt-luna

  solo-sonnet:
    kind: solo
    description: Claude Sonnet 5.5 alone (medium tier).
    members:
      - model: claude-sonnet

  solo-fable:
    kind: solo
    description: Claude Fable 5.2 alone (premium tier); benchmark baseline.
    members:
      - model: claude-fable

  solo-terra:
    kind: solo
    description: GPT-6.1 Terra alone (low tier).
    members:
      - model: gpt-terra

  solo-astra:
    kind: solo
    description: GPT-6.2 Astra alone (premium tier); benchmark baseline.
    members:
      - model: gpt-astra

  solo-flash:
    kind: solo
    description: Gemini 3.8 Flash alone (low tier until 2026-12-31, then medium).
    members:
      - model: gemini-flash

  solo-hydrogen:
    kind: solo
    description: Gemini 4 Hydrogen alone (medium tier).
    members:
      - model: gemini-hydrogen

  solo-carbon:
    kind: solo
    description: Gemini 4 Carbon alone; the Google frontier benchmark baseline.
    members:
      - model: gemini-carbon

  solo-argon:
    kind: solo
    description: Gemini 4 Argon alone (Google's efficient Gemini 4 reasoning model).
    members:
      - model: gemini-argon

  panel-nano:
    kind: panel
    description: >-
      Three nano/low-tier models from three vendors (Haiku 5.5, GPT-6 Luna, Gemini 3.8 Flash),
      merged by Haiku 5.5.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    aggregator: llm
    aggregator_model: claude-haiku

  panel-duo:
    kind: panel
    description: >-
      Claude Haiku 5.5 and GPT-6 Luna; when they agree their vote is the answer with no synthesis
      call, otherwise Haiku merges them. The default (`budget: medium`). A model that fails is
      replaced by another of its price tier, so one outage does not cost the quorum.
    members:
      - model: claude-haiku
      - model: gpt-luna
    aggregator: llm
    aggregator_model: claude-haiku
    # 0.6: between the 0.2.0 ablation's cascade-0.5 (not worse than one model) and 0.7
    # (inconclusive); the 0.3.0 study calibrates it.
    skip_aggregator: {agreement_threshold: 0.6, use: vote}

  panel-mid:
    kind: panel
    description: >-
      Three low/medium-tier models (GPT-6.1 Terra, Gemini 4 Hydrogen, Claude Sonnet 5.5), merged
      by Sonnet 5.5.
    members:
      - model: gpt-terra
      - model: gemini-hydrogen
      - model: claude-sonnet
    aggregator: llm
    aggregator_model: claude-sonnet

  panel-open:
    kind: panel
    description: >-
      Four nano-tier open-weight models through OpenRouter (DeepSeek V4.1 Flash, MiniMax M3.1
      Flash, Qwen 3.8 Flash, GLM-5.3), merged by Claude Haiku 5.5. Needs OPENROUTER_API_KEY.
      A candidate for the 0.3.0 ablation, not a default.
    members:
      - model: deepseek-flash
      - model: minimax-flash
      - model: qwen-flash
      - model: glm
    aggregator: llm
    aggregator_model: claude-haiku

  panel-mixed:
    kind: panel
    description: >-
      Claude Haiku 5.5, GPT-6 Luna and DeepSeek V4.1 Flash (through OpenRouter), merged by Haiku.
      A candidate for the 0.3.0 ablation, not a default.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: deepseek-flash
    aggregator: llm
    aggregator_model: claude-haiku

  panel-cheap-strong-synth:
    kind: panel
    description: The nano panel, merged by Claude Sonnet 5.5 for a stronger final answer.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    aggregator: llm
    aggregator_model: claude-sonnet

  panel-refine:
    kind: panel
    description: The nano panel plus one peer-refinement round before synthesis.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    rounds: 2
    aggregator: llm
    aggregator_model: claude-haiku

  panel-nano-union:
    kind: panel
    description: >-
      The nano panel with lenses, merged by `union` with no model call: every lens's findings,
      duplicates merged, findings the input does not back dropped. For review and debugging.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    aggregator: union

  panel-luna-lenses:
    kind: panel
    description: >-
      GPT-6 Luna asked once per lens (three copies, each covering another area), merged by
      `union` with no model call. A self-mixture whose diversity comes from lenses, not
      temperature. For review and debugging; where a task type has fewer lenses Luna is asked
      fewer times.
    members:
      - model: gpt-luna
      - model: gpt-luna
      - model: gpt-luna
    aggregator: union

  panel-haiku-lenses:
    kind: panel
    description: >-
      Claude Haiku 5.5 asked once per lens (three copies, each covering another area), merged by
      `union` with no model call. The Anthropic counterpart of panel-luna-lenses.
    members:
      - model: claude-haiku
      - model: claude-haiku
      - model: claude-haiku
    aggregator: union

  panel-nano-select:
    kind: panel
    description: >-
      The nano panel where every member answers the whole task from its own approach and one
      cheap Haiku call picks the best answer (`select+patch`: plus a few points the others
      covered). For plans, architecture decisions, asks and patches; the selector costs about a
      tenth of a synthesis.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    aggregator: select+patch
    aggregator_model: claude-haiku

  panel-luna-approaches:
    kind: panel
    description: >-
      GPT-6 Luna asked once per approach (three copies, each answering from another stance),
      then one cheap call picks the best. The self-mixture of panel-nano-select; where a task
      has fewer approaches Luna is asked fewer times.
    members:
      - model: gpt-luna
      - model: gpt-luna
      - model: gpt-luna
    aggregator: select
    aggregator_model: claude-haiku

  panel-nano-auto:
    kind: panel
    description: >-
      The nano panel with `aggregator: auto`: lenses and `union` (no merge call) for review and
      debugging, approaches and a cheap `select+patch` call for plans, decisions, asks and
      patches.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    aggregator: auto
    aggregator_model: claude-haiku

  panel-digest:
    kind: panel
    description: The nano panel with no synthesis call; Claude Code reads the answers and aggregates.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    aggregator: digest

  panel-vote:
    kind: panel
    description: The nano panel with no synthesis call; only the points a majority of models backed are returned.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    aggregator: vote

  best-of-n-verified:
    kind: panel
    description: Benchmark only. The nano panel each write a patch and the task's visible tests pick the best one; no synthesis call. Refused outside `fusion bench`, because it runs code.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    aggregator: verified

  panel-cascade:
    kind: cascade
    description: The two cheapest panel models answer first; if they agree the vote is returned with no synthesis, otherwise the full panel answers and Claude Sonnet 5.5 merges.
    members:
      - model: claude-haiku
      - model: gpt-luna
      - model: gemini-flash
    cascade:
      first: 2
      agreement_threshold: 0.7
      early_aggregator: vote
    aggregator: llm
    aggregator_model: claude-sonnet

  panel-local:
    kind: panel
    description: Local models only (Ollama / LM Studio). Falls back to the cloud panel with a warning when none are enabled.
    members:
      - model: ollama-llama
      - model: lmstudio-local
    aggregator: llm
    aggregator_model: ollama-llama

# The legacy `budget` argument of the tools resolves to a strategy through this table.
budget_strategies:
  low: solo-haiku
  medium: auto
  high: panel-refine
  local_only: panel-local

# Previous strategy names, kept working for one release (0.3.x): a request or a config override
# that uses the old name gets the new strategy. Remove in 0.4.0.
strategy_aliases:
  panel-cheap: panel-nano
  solo-cheap: solo-haiku
  solo-frontier: solo-opus
