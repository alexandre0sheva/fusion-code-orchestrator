# Model catalog: single source of truth for model IDs, capabilities and prices.
#
# Prices are USD per 1M tokens and carry provenance (verified_on + source_url). A model can have
# several price schedules with effective_from/effective_until for scheduled provider changes.
# A row with above_prompt_tokens is a long-context price: it applies to a request whose prompt
# (all input tokens, cached ones included) is larger than that. Each call is priced on its own.
# Re-verify with `uv run fusion models check --live` and the source_url of each price.
# Verified against official provider docs and list-models endpoints on 2026-11-17.
#
# Only the newest model of each family is enabled (owner rule). Older models stay as
# `enabled: false` legacy entries; no Flash-Lite model is used.
#
# provider_limits are client-side caps shared by every call to a provider (max in-flight requests
# and requests per minute); omit a key for "unlimited". Set them to your account's real quota.
# default_reasoning_effort is what Fusion sends when a request does not choose one. Panel models
# default to the cheapest effort that works; baselines and the synthesizer keep provider defaults.
# max_tokens must leave room for thinking tokens, which count against the output cap.

# Price tiers are computed, never written by hand: blended = (3 x input + output) / 4 USD per 1M
# tokens (a 3:1 input:output mix, typical of review and debug calls); the first threshold the
# blended price is below names the tier, otherwise top_tier. Example: $2 / $10 -> $4.00 -> medium.
tiering:
  input_weight: 3
  output_weight: 1
  thresholds:
    - {tier: nano, below: 0.50}
    - {tier: low, below: 2.50}
    - {tier: medium, below: 6.00}
    - {tier: high, below: 12.00}
  top_tier: premium

provider_limits:
  anthropic: {max_concurrent: 8, rpm: 1000}
  openai: {max_concurrent: 8, rpm: 1000}
  google: {max_concurrent: 8, rpm: 1000}

