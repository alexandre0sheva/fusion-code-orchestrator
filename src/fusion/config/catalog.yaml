# Model catalog: single source of truth for model IDs, capabilities and prices.
#
# Prices are USD per 1M tokens and carry provenance (verified_on + source_url). A model can have
# several price schedules with effective_from/effective_until for scheduled provider changes.
# A row with above_prompt_tokens is a long-context price: it applies to a request whose prompt
# (all input tokens, cached ones included) is larger than that. Each call is priced on its own.
# Re-verify with `uv run fusion models check --live` and the source_url of each price.
# Verified against official provider docs and list-models endpoints on 2026-11-17.
#
# Only the newest model of each family is enabled (owner rule). Older models stay as
# `enabled: false` legacy entries; no Flash-Lite model is used.
#
# provider_limits are client-side caps shared by every call to a provider (max in-flight requests
# and requests per minute); omit a key for "unlimited". Set them to your account's real quota.
# default_reasoning_effort is what Fusion sends when a request does not choose one. Panel models
# default to the cheapest effort that works; baselines and the synthesizer keep provider defaults.
# max_tokens must leave room for thinking tokens, which count against the output cap.
# observed_ttft_ms / observed_decode_tps are measured speeds (median time to first token, decode
# tokens per second) from the live study dated observed_on. They rank models for `speed: fast`,
# hedges and same-tier fallbacks, and time the early-return grace. The 0.3.0 study refreshes them.

# Price tiers are computed, never written by hand: blended = (3 x input + output) / 4 USD per 1M
# tokens (a 3:1 input:output mix, typical of review and debug calls); the first threshold the
# blended price is below names the tier, otherwise top_tier. Example: $2 / $10 -> $4.00 -> medium.
tiering:
  input_weight: 3
  output_weight: 1
  thresholds:
    - {tier: nano, below: 0.50}
    - {tier: low, below: 2.50}
    - {tier: medium, below: 6.00}
    - {tier: high, below: 12.00}
  top_tier: premium

provider_limits:
  anthropic: {max_concurrent: 8, rpm: 1000}
  openai: {max_concurrent: 8, rpm: 1000}
  google: {max_concurrent: 8, rpm: 1000}
  openrouter: {max_concurrent: 8, rpm: 1000}

# OpenRouter (provider `openrouter`, key OPENROUTER_API_KEY). It serves the open-weight models
# below, and it is the fallback route for Anthropic, OpenAI and Google models: each of those has
# `route` (direct | openrouter | auto; auto = the vendor's API when its key is set, else OpenRouter)
# and `openrouter_id`. A call through OpenRouter is billed what OpenRouter reports (usage.cost).
#
# Privacy (owner rule: no provider that trains on prompts; retaining or logging is allowed).
# OpenRouter has no per-request "no training" switch, so it is enforced in two layers:
#   1. the account setting at https://openrouter.ai/settings/privacy that disables providers which
#      may train on inputs (required; `fusion doctor` reminds you, it cannot read the setting);
#   2. provider_ignore below, sent with every request: the providers OpenRouter's provider list
#      marks `dataPolicy.training: true`. `fusion models check --live` re-reads that list and flags
#      any training provider missing here. A config layer can add slugs, never remove these.
# Requests also send data_collection: "allow" (deny would drop every provider that stores data,
# stricter than the rule) and require_parameters: true.
openrouter:
  provider_ignore: [deepseek, liquid, nvidia, thinkingmachines]
  verified_on: 2026-11-17
  source_url: https://openrouter.ai/docs/guides/privacy/provider-logging

