# The headline study on dataset v2 (roadmap Task 16): the frontier and cheap models alone against
# Fusion, on the held-out test split. Run it only after ablation-v3 has settled the defaults, and
# do not change an arm afterwards: nothing may be tuned on these tasks.
#
#   fusion bench plan --suite headline-v3
#   fusion bench run  --suite headline-v3 --max-usd 5.7
#
# `fusion-best` was frozen on 2026-11-19 from `fusion bench recommend v3-ablation` (the nano panel
# with `select`), before this suite ran; it must not change after that. `fusion-default` is
# `auto` as calibrated by route-v3 (classifier off).
description: >-
  Opus 5.5, Sol, Haiku and Luna alone, Fusion's default when it ran (strategy auto) and the best
  ablation variant (the nano panel with select, the default since), on a stratified subset of the
  v2 test split, judged by neutral OpenRouter judges.
stage: final study on test
dataset: v2
split: test
# Every text task of the test split (10 per category); the executable categories are sampled, as
# a real-repo coding task costs several text tasks.
quota: {code_review: 10, debugging: 10, architecture: 10, planning: 10, coding: 3, frontend: 2, performance: 2}
repeats: 1
seed: 100
max_usd: 5.7
spend_stop_usd: 14.5   # keeps $0.50 of the $15 v0.3.0 budget in reserve
concurrency: 8
# The neutral judges of ablation-v3 (Xiaomi and Meta are on no arm here either).
judge_models: [mimo-pro, muse-ember]
neutral_judges: true
arms:
  - {name: solo-opus, strategy: solo-opus}           # Claude Opus 5.5
  - {name: solo-sol, strategy: solo-sol}             # GPT-6.2 Sol
  - {name: solo-haiku, strategy: solo-haiku}
  - {name: solo-luna, strategy: solo-luna}
  - {name: fusion-default, strategy: auto}
  - {name: fusion-best, strategy: panel-nano-select, overrides: {aggregator: select}}  # frozen
