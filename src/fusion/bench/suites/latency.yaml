# Is the default as fast as one frontier model, and which latency control pays off? Wall time is
# the measurement, so the response cache is off (a replayed call has no real latency). The arms
# are Opus 5.5 alone (the median to match), the panel default (panel-duo) as shipped, the same panel
# with every latency control off, the three-model panel (where early return can drop a straggler),
# the panel default with GPT-6 Luna at reasoning effort none (does the lowest effort hold quality?),
# and strategy auto, the default from roadmap Task 9 until the 0.3.0 study chose panel-nano-pick.
#
#   fusion bench run --suite latency --max-usd 1.2
description: >-
  Opus 5.5 alone against the default panel with and without its latency controls, the
  three-model panel and Luna at effort none, on a small dev subset with the response cache off
  (latency budget: about $1.20).
stage: tune on dev
dataset: v1
split: dev
quota: {code_review: 3, debugging: 3, architecture: 1, planning: 2}
repeats: 1
seed: 0
max_usd: 1.2
spend_stop_usd: 14.5   # keeps $0.50 of the $15 v0.3.0 budget in reserve
concurrency: 4
cache: false
judge_models: []
arms:
  - {name: solo-opus, strategy: solo-opus}
  - {name: default, strategy: panel-duo}
  - name: levers-off
    strategy: panel-duo
    overrides: {skip_aggregator: null, fanout: {early_return: off, hedge_after_ms: off}}
  - {name: nano-early-return, strategy: panel-nano}
  - name: luna-none
    strategy: panel-duo
    overrides: {members: [{model: claude-haiku}, {model: gpt-luna, reasoning_effort: none}]}
  - {name: auto-route, strategy: auto}
