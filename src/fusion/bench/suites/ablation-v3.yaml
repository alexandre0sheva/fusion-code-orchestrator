# Ablations on dataset v2 (roadmap Task 16 runs them; Task 14 wrote them): which design choice
# buys quality, and at what cost. Dev split only. Each arm is the nano panel with one thing
# changed, or a whole alternative (another panel, the cascade, verified generation, the router),
# so the differences between arms are the effect of that one choice.
# Baseline for `fusion bench report --baseline nano`: the nano panel with lenses and llm synthesis.
#
#   fusion bench plan --suite ablation-v3
#   fusion bench run  --suite ablation-v3 --max-usd 3.4
description: >-
  Nano, open-weight, mixed and mid panels; lenses on and off; llm, select, vote and digest
  aggregation; the cascade threshold from 0.5 to 0.9; verified-synth; and auto routing with the
  frontier rung off and on, on a stratified subset of the v2 dev split, judged by neutral
  OpenRouter judges.
stage: tune on dev
dataset: v2
split: dev
# 9 tasks: every category, review and coding twice. About $3.40 of Task 16's ~$7: real-repo coding
# tasks show whole packages (up to ~50K tokens), so a coding task costs several text tasks.
# Widen the quota if the runs cost less than planned.
quota: {code_review: 2, debugging: 1, architecture: 1, planning: 1, coding: 2, frontend: 1, performance: 1}
repeats: 1
seed: 0
max_usd: 3.4
spend_stop_usd: 14.5   # keeps $0.50 of the $15 v0.3.0 budget in reserve
concurrency: 8
# Judges from vendors on no arm (Xiaomi and Meta; the panels use Anthropic, OpenAI, Google,
# DeepSeek, MiniMax, Qwen and Z.ai), and the study refuses to start otherwise. The two that passed
# both v2 judge calibrations (docs/BENCHMARKING.md, Calibrating judges); MiMo Pro, listed first,
# decides review and debugging points, and a 1-1 split on a rubric item counts as not met.
judge_models: [mimo-pro, muse-ember]
neutral_judges: true
arms:
  # --- panels: who sits on them (the default nano panel is the baseline) ---
  - {name: nano, strategy: panel-nano}              # Haiku, Luna, Flash; lenses; Haiku merges
  - {name: open, strategy: panel-open}              # four open-weight models via OpenRouter
  - {name: mixed, strategy: panel-mixed}            # Haiku, Luna, DeepSeek V4.1 Flash
  - {name: mid, strategy: panel-mid}                # Terra, Hydrogen, Sonnet; Sonnet merges
  # --- lenses ---
  - {name: lenses-off, strategy: panel-nano, overrides: {lenses: off}}
  # --- aggregation: llm (nano) against select, vote and digest ---
  - {name: select, strategy: panel-nano-select, overrides: {aggregator: select}}
  - {name: vote, strategy: panel-vote}
  - {name: digest, strategy: panel-digest}
  # --- the cascade's agreement threshold, at both ends of 0.5-0.9 (0.7, the shipped value, was
  # inconclusive in the v1 ablation; add it back with `--arms` if the budget allows) ---
  - {name: cascade-0.5, strategy: panel-cascade, overrides: {cascade: {agreement_threshold: 0.5}}}
  - {name: cascade-0.9, strategy: panel-cascade, overrides: {cascade: {agreement_threshold: 0.9}}}
  # --- verified generation ---
  - {name: verified-synth, strategy: verified-synth}
  # --- difficulty routing: the default, with the frontier rung off and on ---
  - {name: auto-route, strategy: auto}
  - {name: auto-route-frontier, strategy: auto-frontier}
