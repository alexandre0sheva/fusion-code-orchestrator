[project]
name = "fusion-code-orchestrator"
version = "0.1.0"
description = "Multi-model orchestration and evaluation engine for coding workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Oleksandr Shevchenko" }]
keywords = ["mcp", "llm", "orchestration", "code-review", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.0",
    "httpx[http2]>=0.28",
    "platformdirs>=4.10",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "rich>=15.0",
    "starlette>=0.40",
    "tomlkit>=0.15.1",
    "typer>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Screenshots, the console and accessibility checks of frontend benchmark tasks (roadmap Task 17).
# After installing: `playwright install chromium`. Nothing else needs it.
bench-visual = ["playwright>=1.49"]

[project.urls]
Homepage = "https://github.com/alexandre0sheva/fusion-code-orchestrator"
Repository = "https://github.com/alexandre0sheva/fusion-code-orchestrator"
Issues = "https://github.com/alexandre0sheva/fusion-code-orchestrator/issues"
Documentation = "https://github.com/alexandre0sheva/fusion-code-orchestrator/tree/main/docs"

[project.scripts]
fusion = "fusion.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]

# The files `fusion install` copies live in the repository's integrations/ directory; the wheel
# carries them inside the package so `uvx --from git+... fusion install ...` can find them.
[tool.hatch.build.targets.wheel.force-include]
"integrations" = "fusion/_integrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls real provider APIs and costs money; skipped unless run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "evals"]
# The executable datasets' files are task material (stubs, buggy code, hidden tests), not our code.
extend-exclude = [
    "evals/datasets/v1/coding",
    "evals/datasets/v1/frontend",
    "evals/datasets/v1/performance",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/test_sitecheck.py" = ["E501"]  # one-line HTML fixtures
# One-line SVG and HTML templates of the HTML report.
"src/fusion/bench/report/charts.py" = ["E501"]
"src/fusion/bench/report/html.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fusion"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "playwright", "playwright.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]
