[project]
name = "fusion-code-orchestrator"
version = "0.2.0"
description = "Multi-model orchestration and evaluation engine for coding workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Oleksandr Shevchenko" }]
keywords = ["mcp", "llm", "orchestration", "code-review", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=4.2",
    "httpx[http2]>=0.28",
    "platformdirs>=4.14",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "rich>=15.0",
    "starlette>=1.10",
    "tomlkit>=0.15.2",
    "typer>=0.29",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Screenshots, the console and accessibility checks of frontend benchmark tasks (roadmap Task 17).
# After installing: `playwright install chromium`. Nothing else needs it.
bench-visual = ["playwright>=1.65"]

[project.urls]
Homepage = "https://github.com/alexandre0sheva/fusion-code-orchestrator"
Repository = "https://github.com/alexandre0sheva/fusion-code-orchestrator"
Issues = "https://github.com/alexandre0sheva/fusion-code-orchestrator/issues"
Documentation = "https://github.com/alexandre0sheva/fusion-code-orchestrator/tree/main/docs"

[project.scripts]
fusion = "fusion.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion"]

# The files `fusion install` copies live in the repository's integrations/ directory; the wheel
# carries them inside the package so `uvx --from git+... fusion install ...` can find them.
[tool.hatch.build.targets.wheel.force-include]
"integrations" = "fusion/_integrations"
# The benchmark datasets, so `fusion bench --dataset v2` works from a wheel or `uvx --from git+...`.
"evals/datasets/v1" = "fusion/bench/datasets/v1"
"evals/datasets/v2" = "fusion/bench/datasets/v2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real provider APIs and costs money; skipped unless run with -m live",
    "slow: runs the shipped dataset's code in the sandbox (minutes); CI runs it in its own job",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "evals"]
# The executable datasets' files are task material (stubs, buggy code, hidden tests), not our code.
extend-exclude = [
    "evals/datasets/v1/coding",
    "evals/datasets/v1/frontend",
    "evals/datasets/v1/performance",
    "evals/datasets/v2/coding",
    "evals/datasets/v2/frontend",
    "evals/datasets/v2/performance",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/test_sitecheck.py" = ["E501"]  # one-line HTML fixtures
# One-line SVG and HTML templates of the HTML report.
"src/fusion/bench/report/charts.py" = ["E501"]
"src/fusion/bench/report/html.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fusion"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "playwright", "playwright.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mypy>=2.4.1",
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17",
]
