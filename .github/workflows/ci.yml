name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: an advisory published against an unchanged lock file should still turn CI red.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests evals
      - name: Type check
        run: uv run mypy
      - name: Test (offline, mock providers)
        run: uv run pytest -q --cov=fusion --cov-report=term
      - name: Coverage gate (at least 85% on each core package)
        run: |
          uv run coverage report --include="src/fusion/orchestration/*" --fail-under=85
          uv run coverage report --include="src/fusion/providers/*" --fail-under=85
          uv run coverage report --include="src/fusion/bench/*" --fail-under=85

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Audit the locked dependencies for known vulnerabilities
        # Exports exactly what uv.lock pins (with hashes), so the audit covers what CI installs.
        run: |
          uv export --locked --no-emit-project --all-groups -o requirements-audit.txt
          uvx pip-audit@2.10.1 --disable-pip -r requirements-audit.txt --progress-spinner off
