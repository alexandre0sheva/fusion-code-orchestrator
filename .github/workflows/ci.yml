name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests evals
      - name: Type check
        run: uv run mypy
      - name: Test (offline, mock providers)
        run: uv run pytest -q --cov=fusion --cov-report=term-missing
