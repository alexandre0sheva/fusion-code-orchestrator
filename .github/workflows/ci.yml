name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: an advisory published against an unchanged lock file should still turn CI red.
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups --locked --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests evals
      - name: Type check
        run: uv run mypy
      - name: Test (offline, mock providers)
        run: uv run pytest -q --cov=fusion --cov-report=term
      - name: Coverage gate (at least 85% on each core package)
        run: |
          uv run coverage report --include="src/fusion/orchestration/*" --fail-under=85
          uv run coverage report --include="src/fusion/providers/*" --fail-under=85
          uv run coverage report --include="src/fusion/bench/*" --fail-under=85

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Audit the locked dependencies for known vulnerabilities
        # Exports exactly what uv.lock pins (with hashes), so the audit covers what CI installs.
        run: |
          uv export --locked --no-emit-project --all-groups -o requirements-audit.txt
          uvx pip-audit@2.10.1 --disable-pip -r requirements-audit.txt --progress-spinner off

  package:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build the wheel and the source distribution
        run: uv build
      - name: Check the wheel carries the configs, dashboard, integrations and dataset
        run: uv run --no-project --python 3.12 python evals/runners/check_wheel.py dist/*.whl
      - name: Run the wheel the way a user would, in an empty directory
        # --no-cache: uv would otherwise reuse an earlier build of the same version.
        run: |
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/*.whl)"
          cd "$(mktemp -d)"
          uvx --no-cache --from "$wheel" fusion version
          uvx --no-cache --from "$wheel" fusion bench plan --dataset v1 --arms solo-cheap --mock
