# The public website (GitHub Pages): the pages are docs/*.md as they are, plus the landing page
# (docs/index.md) and the interactive benchmark report. Build it locally with
#   uv sync --group site && uv run mkdocs build --strict
# (CONTRIBUTING.md, "The website"). Nothing is copied: scripts/mkdocs_hooks.py turns links that
# leave docs/ into links to the repository, and docs/benchmark-report.html and docs/assets/ are
# served as they are.
site_name: Fusion Code Orchestrator
site_description: A panel of cheap LLMs that advises Claude Code, and the measurements of whether it beats one big model.
site_url: https://alexandre0sheva.github.io/fusion-code-orchestrator/
repo_url: https://github.com/alexandre0sheva/fusion-code-orchestrator
repo_name: alexandre0sheva/fusion-code-orchestrator
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

# Plans are working documents, not product docs; docs/README.md is the folder index GitHub shows
# (the site's own index is index.md).
exclude_docs: |
  superpowers/
  /README.md

hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's anchors, so the docs' own links (checked by tests/test_docs_links.py) work on
      # GitHub and on the site.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Using it:
      - Integrations: INTEGRATIONS.md
      - Configuration: CONFIGURATION.md
  - How it works:
      - Architecture: ARCHITECTURE.md
      - Costs: COSTS.md
      - Security: https://github.com/alexandre0sheva/fusion-code-orchestrator/blob/main/SECURITY.md
  - Evidence:
      - Benchmark results: BENCHMARK_RESULTS.md
      - Interactive report: benchmark-report.html
      - Benchmarking: BENCHMARKING.md
      - Claude Code A/B: CLAUDE_CODE_AB.md
  - Changelog: https://github.com/alexandre0sheva/fusion-code-orchestrator/blob/main/CHANGELOG.md
